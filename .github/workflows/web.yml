# Compila el juego para la web con Godot (sin tener Godot instalado) y lo publica
# en GitHub Pages.
# - En las ramas de trabajo: tests + build + prueba en navegador.
# - En main (después de mergear un PR ya probado): solo build y publicación,
#   para que publicar tarde un par de minutos.
# - La medición de rendimiento se corre a mano (Actions > Run workflow > perf).
name: Web build

on:
  push:
  workflow_dispatch:
    inputs:
      perf:
        description: "Medir rendimiento en el navegador (varias carreras)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Descargar Godot y plantillas de exportación
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Solo hacen falta las plantillas web.
          unzip -q templates.tpz 'templates/web_*' 'templates/version.txt'
          rm godot.zip templates.tpz

      - name: Instalar plantillas
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Importar el proyecto
        run: godot --headless --path . --import 2>&1 | tee import.log || true

      - name: Tests
        if: github.ref != 'refs/heads/main'
        run: |
          timeout 900 godot --headless --path . --fixed-fps 60 --script res://tests/run_tests.gd 2>&1 | tee tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" tests.log import.log; then
            echo "::error::Hay errores de scripts (ver arriba)"
            exit 1
          fi
          grep -q "TESTS OK" tests.log

      - name: Exportar para web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.html
          test -f build/web/index.pck
          ls -la build/web

      - name: Cache de Chromium
        if: github.ref != 'refs/heads/main'
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-chromium

      - name: Probar en navegador (Chromium)
        if: github.ref != 'refs/heads/main'
        run: |
          npm install --no-save --silent playwright@1.49.1
          if [ "${{ steps.cache-chromium.outputs.cache-hit }}" != "true" ]; then
            # Si los servidores de Ubuntu no responden, seguir sin las dependencias extra.
            npx playwright install --with-deps chromium > /dev/null || npx playwright install chromium > /dev/null
          fi
          python3 -m http.server 8000 --directory build/web > /dev/null 2>&1 &
          sleep 1
          node tests/web_smoke.mjs http://localhost:8000/index.html screens

      - name: Medir rendimiento en navegador (varias carreras)
        if: github.event_name == 'workflow_dispatch' && inputs.perf
        continue-on-error: true
        run: |
          python3 -m http.server 8001 --directory build/web > /dev/null 2>&1 &
          sleep 1
          node tests/web_perf.mjs http://localhost:8001/index.html

      - name: Guardar capturas del navegador
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: screens
          if-no-files-found: ignore

      - name: Guardar el build (descargable desde la pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: simplesurf-web
          path: build/web

      - name: Preparar para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
