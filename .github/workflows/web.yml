# Compila el juego para la web con Godot (sin tener Godot instalado) y lo publica
# en GitHub Pages.
#
# Al mergear en main corren dos trabajos a la vez:
# - publish: chequea que todos los scripts compilen (si no, NO publica y queda la
#   versión anterior), arma el juego y lo publica. Tarda un par de minutos.
# - tests: tests del juego + prueba en navegador. No frenan la publicación: si
#   fallan, se corrige con un cambio aparte.
# La medición de rendimiento se corre a mano (Actions > Run workflow > perf).
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      perf:
        description: "Medir rendimiento en el navegador (varias carreras)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# La concurrencia va por trabajo (no por workflow): así los tests lentos de un
# cambio anterior nunca frenan la publicación del siguiente.

env:
  GODOT_VERSION: "4.5.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot

      - name: Chequeo de compilación
        run: |
          godot --headless --path . --script res://tests/compile_check.gd 2>&1 | tee compile.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" compile.log import.log; then
            echo "::error::Hay scripts que no compilan: no se publica"
            exit 1
          fi
          grep -q "COMPILA OK" compile.log

      - name: Exportar para web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.html
          test -f build/web/index.pck

      - name: Guardar el build (descargable desde la pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: simplesurf-web
          path: build/web

      - name: Preparar para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tests:
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot

      - name: Tests
        run: |
          timeout 900 godot --headless --path . --fixed-fps 60 --script res://tests/run_tests.gd 2>&1 | tee tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" tests.log import.log; then
            echo "::error::Hay errores de scripts (ver arriba)"
            exit 1
          fi
          grep -q "TESTS OK" tests.log

      - name: La física no depende de los FPS
        if: always()
        run: python3 tests/fps_compare.py godot

      - name: Exportar para web (para la prueba en navegador)
        if: always()
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html > export.log 2>&1

      - name: Cache de Chromium
        if: always()
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-chromium

      - name: Probar en navegador (Chromium)
        if: always()
        run: |
          npm install --no-save --silent playwright@1.49.1
          if [ "${{ steps.cache-chromium.outputs.cache-hit }}" != "true" ]; then
            # Si los servidores de Ubuntu no responden, seguir sin las dependencias extra.
            npx playwright install --with-deps chromium > /dev/null || npx playwright install chromium > /dev/null
          fi
          python3 -m http.server 8000 --directory build/web > /dev/null 2>&1 &
          sleep 1
          node tests/web_smoke.mjs http://localhost:8000/index.html screens

      - name: Medir rendimiento en navegador (varias carreras)
        if: github.event_name == 'workflow_dispatch' && inputs.perf
        continue-on-error: true
        run: |
          python3 -m http.server 8001 --directory build/web > /dev/null 2>&1 &
          sleep 1
          node tests/web_perf.mjs http://localhost:8001/index.html

      - name: Guardar capturas del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: screens
          if-no-files-found: ignore
