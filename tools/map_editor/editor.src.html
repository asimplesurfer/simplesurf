<title>Editor de mapas SimpleSurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: carta náutica a pantalla completa; herramientas a la izquierda, propiedades a la derecha (en el teléfono, apiladas). */
:root {
  --bg: #e9f0f3;
  --panel: #ffffff;
  --panel-2: #f4f8fa;
  --ink: #10232e;
  --muted: #587080;
  --line: #d2dde3;
  --accent: #f0603f;
  --accent-ink: #ffffff;
  --sel: #ff9f1c;
  --ok: #2c8a57;
  --warn: #b86e00;
  --bad: #c2392d;
  --sea-out: #0f4f73;
  --sea-in: #1f86ae;
  --lane: #5cc3d8;
  --rope: #f6f1e4;
  --sand: #efd49b;
  --grass: #74c15c;
  --rock: #8b6a55;
  --cave: #0e6f74;
  --glow: #2fe3c8;
  --grid: rgba(255, 255, 255, 0.07);
  --f-display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a141a; --panel: #101d25; --panel-2: #142530; --ink: #e2edf2; --muted: #8ba2ae; --line: #22363f;
    --accent: #ff7a5c; --accent-ink: #1a0b06; --sel: #ffb347; --ok: #4cc283; --warn: #f0a63a; --bad: #ff6b5e;
    --sea-out: #08324a; --sea-in: #135f80; --lane: #3aa3ba; --rope: #d9d2c0; --grid: rgba(255, 255, 255, 0.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a141a; --panel: #101d25; --panel-2: #142530; --ink: #e2edf2; --muted: #8ba2ae; --line: #22363f;
  --accent: #ff7a5c; --accent-ink: #1a0b06; --sel: #ffb347; --ok: #4cc283; --warn: #f0a63a; --bad: #ff6b5e;
  --sea-out: #08324a; --sea-in: #135f80; --lane: #3aa3ba; --rope: #d9d2c0; --grid: rgba(255, 255, 255, 0.05);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand span { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 11px; line-height: 1;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
select.btn { padding-right: 8px; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 56px 1fr 300px; gap: 10px; }
.tools { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.tool {
  width: 42px; height: 42px; border-radius: 9px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; position: relative; color: var(--ink);
}
.tool:hover { background: var(--panel-2); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tool svg { width: 22px; height: 22px; }
.tool .key { position: absolute; right: 3px; bottom: 2px; font: 500 9px var(--f-mono); opacity: 0.6; }
.tools hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

.stage { position: relative; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sea-out); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint {
  position: absolute; left: 10px; bottom: 10px; right: 10px; pointer-events: none; display: flex; justify-content: space-between; gap: 10px; align-items: end;
}
.hint .msg { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 60ch; font-size: 12.5px; }
.hint .coords { font: 12px var(--f-mono); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 34px; height: 34px; justify-content: center; padding: 0; }

aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; color: var(--muted); }
.field { display: grid; grid-template-columns: 1fr 108px; gap: 8px; align-items: center; }
.field label { font-size: 13px; min-width: 0; }
.field input[type="number"], .field input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--panel-2); font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.field input[type="color"] { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 2px; }
.field input[type="checkbox"] { justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0; }
.warns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.warns li { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 12.5px; line-height: 1.4; }
.pill { font: 600 10px var(--f-body); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 99px; align-self: start; }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 8px; }
.stat b { display: block; font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(5, 15, 20, 0.5); }
.dlg { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dlg h3 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.dlg textarea { width: 100%; min-height: 260px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font: 12px/1.45 var(--f-mono); padding: 10px; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 13px; z-index: 20; }
.saved-list { display: flex; flex-direction: column; gap: 4px; }
.saved-list button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 9px; display: flex; justify-content: space-between; gap: 8px; }
.saved-list small { color: var(--muted); font-family: var(--f-mono); }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 62vh auto; }
  .tools { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .tools hr { border-top: 0; border-left: 1px solid var(--line); margin: 2px 4px; }
  aside { overflow: visible; }
  .hint .msg { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="brand"><h1>Editor de mapas</h1><span>SimpleSurf · vista desde arriba, en metros</span></div>
  <div class="row">
    <select class="btn" id="mapPicker" aria-label="Abrir un mapa"></select>
    <button class="btn" id="undoBtn" title="Deshacer (Ctrl+Z)">Deshacer</button>
    <button class="btn" id="redoBtn" title="Rehacer (Ctrl+Shift+Z)">Rehacer</button>
    <button class="btn" id="importBtn">Importar</button>
    <button class="btn" id="exportBtn">Ver JSON</button>
    <button class="btn" id="downloadBtn" title="Baja el archivo del mapa para subirlo a world/maps/ en GitHub">Descargar mapa</button>
    <button class="btn primary" id="saveBtn" title="Lo deja guardado para que Claude lo agregue al juego">Guardar para el juego</button>
  </div>
</header>

<div class="app">
  <nav class="tools" aria-label="Herramientas">
    <button class="tool" data-tool="select" title="Seleccionar y mover (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span class="key">V</span></button>
    <button class="tool" data-tool="pan" title="Mover la vista (H o espacio)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 12V6a1.5 1.5 0 013 0v5M11 11V4.5a1.5 1.5 0 013 0V11M14 11V6a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7s-5-2-6.5-5L3.8 12a1.4 1.4 0 012.3-1.6L8 13"/></svg><span class="key">H</span></button>
    <hr>
    <button class="tool" data-tool="track" title="Pista: clic pone un punto, arrastrar hace curva (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18c3-9 6 2 9-6s5-4 7-6"/><circle cx="4" cy="18" r="1.8" fill="currentColor"/><circle cx="20" cy="6" r="1.8" fill="currentColor"/></svg><span class="key">P</span></button>
    <button class="tool" data-tool="rock" title="Roca o cueva: dibujá la figura (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 19l3-8 4-3 3 2 3-5 5 14z"/><path d="M9 19c0-3 1.5-5 3-5s3 2 3 5" /></svg><span class="key">R</span></button>
    <button class="tool" data-tool="start" title="Meta: una recta con la largada (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h12l-2 4 2 4H6"/><path d="M10 4v8M14 4v8" stroke-dasharray="2 2"/></svg><span class="key">M</span></button>
    <button class="tool" data-tool="tropical_island" title="Isla tropical: dibujá la figura (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18c3-3 6-2 9-3s6-3 9-1"/><path d="M8 15V9m0 0c-2-2-4-1.5-5 0m5 0c1.5-2 3.5-2 5-.5M15 14V8m0 0c-1.5-1.8-3.5-1.5-4.5 0m4.5 0c1.5-2 3.5-1.8 4.5-.2" stroke-linecap="round"/></svg><span class="key">T</span></button>
    <button class="tool" data-tool="island_split" title="Dividir isla: dibujá una línea que cruce una isla tropical y queda partida en dos, con mar en el medio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9c2-4 5-5 7-4v14c-3 1-6 0-7-4z"/><path d="M14 5c2-1 5 0 7 4v6c-1 4-4 5-7 4z"/><path d="M12 2v20" stroke-dasharray="2 2"/></svg></button>
    <button class="tool" data-tool="light_string" title="Guirnalda de luces: tocá una isla tropical y después otra (de noche se prenden)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6c5 6 13 6 18 0"/><circle cx="7" cy="10" r="1.6" fill="currentColor"/><circle cx="12" cy="11.5" r="1.6" fill="currentColor"/><circle cx="17" cy="10" r="1.6" fill="currentColor"/><path d="M3 4v16M21 4v16"/></svg></button>
    <button class="tool" data-tool="island" title="Isla (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="16" rx="8" ry="3.5"/><path d="M12 15V8m0 0c-2-2-4-2-5-1m5 1c2-2 4-2 5-1m-5 1c-1-2-1-3.5 0-4.5"/></svg><span class="key">I</span></button>
    <hr>
    <button class="tool" data-tool="geyser" title="Géiser (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="19" rx="6" ry="2"/><path d="M12 17V6m-3 4l3-4 3 4M8 13c-1-2 0-4 1-5m7 5c1-2 0-4-1-5"/></svg><span class="key">G</span></button>
    <button class="tool" data-tool="volcano" title="Isla volcán"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 20l6-11h6l6 11z"/><path d="M10 9c0-2 1-3 2-5m2 5c0-2 1-3 2-4" stroke-linecap="round"/></svg></button>
    <button class="tool" data-tool="rock_arch" title="Arco de roca (paisaje)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20V12a9 9 0 0118 0v8h-4v-8a5 5 0 00-10 0v8z"/></svg></button>
    <button class="tool" data-tool="waterfall" title="Cascada (ponela en la salida de una cueva, cruzando la pista)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h16M7 4v12M11 4v14M15 4v12M19 4v10"/><path d="M4 20c2-1.5 4-1.5 6 0s4 1.5 6 0 3-1 4-.5"/></svg></button>
    <button class="tool" data-tool="shipwreck" title="Barco hundido (paisaje)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 15h18l-3 5H6z"/><path d="M11 15V4l6 7h-6"/></svg></button>
  </nav>

  <div class="stage">
    <canvas id="cv" aria-label="Mapa"></canvas>
    <div class="zoom">
      <button class="btn" id="zoomIn" aria-label="Acercar">+</button>
      <button class="btn" id="zoomOut" aria-label="Alejar">−</button>
      <button class="btn" id="zoomFit" aria-label="Ver todo el mapa" title="Ver todo (F)">⤢</button>
    </div>
    <div class="hint"><div class="msg" id="hint"></div><div class="coords" id="coords">x 0 · z 0</div></div>
  </div>

  <aside>
    <section id="selSection">
      <h2 id="selTitle">Mapa</h2>
      <div id="selFields"></div>
    </section>
    <section>
      <h2>Revisión</h2>
      <div class="stats" id="stats"></div>
      <ul class="warns" id="warns"></ul>
    </section>
    <section>
      <h2>Guardados para el juego</h2>
      <div class="saved-list" id="savedList"><p class="note">Cargando…</p></div>
    </section>
  </aside>
</div>

<dialog id="jsonDlg">
  <form method="dialog" class="dlg">
    <h3 id="jsonTitle">JSON del mapa</h3>
    <p class="note" id="jsonNote">Este es el archivo del mapa, tal como lo lee el juego (world/maps/).</p>
    <textarea id="jsonText" spellcheck="false"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="jsonCopy" type="button">Copiar</button>
      <button class="btn" id="jsonDownload" type="button">Descargar .json</button>
      <button class="btn primary" id="jsonLoad" type="button" hidden>Abrir este mapa</button>
      <button class="btn" value="close">Cerrar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Datos: mismo formato que world/maps/*.json del juego.
// ---------------------------------------------------------------------------
const BUILTIN = /*MAPS*/;

// Piezas que entiende el juego (world/pieces/*.gd) y sus parámetros.
// k: tipo de campo; d: valor por defecto (si el mapa no lo dice, el juego usa este).
const PIECES = {
  geyser: { name: "Géiser", params: [
    ["phase", "Desfase (s)", "num", 0], ["calm", "Tranquilo (s)", "num", 3.6], ["warn", "Aviso (s)", "num", 1.4],
    ["erupt", "Chorro (s)", "num", 1.3], ["launch_speed", "Fuerza (m/s)", "num", 17] ] },
  volcano: { name: "Isla volcán", params: [["radius", "Radio (m)", "num", 40], ["island_seed", "Semilla palmeras", "int", -1]] },
  rock_arch: { name: "Arco de roca", params: [
    ["angle", "Ángulo (°)", "num", 0], ["span", "Ancho (m)", "num", 40], ["height", "Alto (m)", "num", 26],
    ["shape_seed", "Semilla", "int", 77], ["stone_color", "Piedra", "color", "#806b5c"], ["moss_color", "Musgo", "color", "#5c8c4d"] ] },
  shipwreck: { name: "Barco hundido", params: [["angle", "Ángulo (°)", "num", 40.107], ["size", "Tamaño", "num", 1.5]] },
  waterfall: { name: "Cascada", params: [
    ["angle", "Ángulo (°)", "num", 0], ["width", "Ancho (m)", "num", 50], ["height", "Altura (m)", "num", 34],
    ["color", "Agua", "color", "#bdf3ff"], ["drag", "Cuánto frena (0–1)", "num", 0.12] ] },
  tropical_island: { name: "Isla tropical", params: [
    ["beach_width", "Ancho de la playa (m)", "num", 5], ["palm_density", "Palmeras (cada 100 m²)", "num", 1.2],
    ["rocks", "Piedras en la arena", "int", 3], ["crowd", "Público en la playa (0 = nadie)", "num", 1],
    ["sand_color", "Arena", "color", "#f2d8a0"],
    ["grass_color", "Pasto", "color", "#3f7f2c"], ["leaf_color", "Hojas", "color", "#2f8f2c"], ["shape_seed", "Semilla", "int", 1] ] },
  island_split: { name: "Dividir isla", params: [["width", "Ancho del mar en el medio (m)", "num", 14]] },
  light_string: { name: "Guirnalda de luces", params: [
    ["lines", "Cables (1 a 20)", "int", 1],
    ["style", "Luces", "choice", "calida", [["calida", "Cálidas"], ["fria", "Frías"], ["navidad", "Navideñas"]]] ] },
  rock_formation: { name: "Roca / cueva", params: [
    ["height", "Alto de la roca (m)", "num", 34], ["ceiling", "Altura del techo (m)", "num", 12],
    ["opening", "Arco abajo (si no toca la pista)", "bool", false], ["opening_width", "Ancho del arco (m)", "num", 16],
    ["darkness", "Oscuridad al entrar (0–1)", "num", 0.78], ["adapt_time", "Ojos se acostumbran (s)", "num", 1.6],
    ["stone_low", "Piedra abajo", "color", "#8a4a2e"], ["stone_high", "Piedra arriba", "color", "#b89a74"],
    ["grass_color", "Pasto arriba", "color", "#6fae4a"], ["moss_color", "Musgo", "color", "#6f8f3a"],
    ["glow_color", "Agua y luz de la cueva", "color", "#2fe3c8"], ["shape_seed", "Semilla", "int", 1] ] },
};
const GEYSER_RADIUS = 4;
// Piezas que se dibujan con puntos y manijas: dónde guardan los puntos y si la
// figura es cerrada (roca, isla) o un camino abierto (corte que divide islas).
const DRAWN = {
  rock_formation: { key: "shape", closed: true, tool: "rock", label: "una roca" },
  tropical_island: { key: "shape", closed: true, tool: "tropical_island", label: "una isla" },
  island_split: { key: "path", closed: false, tool: "island_split", label: "un corte" },
};
const nodesOf = (p) => p[DRAWN[p.type].key];
const isClosed = (p) => DRAWN[p.type]?.closed !== false;
// Parámetros que el juego exige aunque tengan el valor de siempre.
const REQUIRED = { volcano: ["radius"] };

const MAP_FIELDS = [
  ["name", "Nombre en el menú", "text"], ["order", "Número de mapa", "int"], ["laps", "Vueltas", "int"],
  ["half_width", "Mitad del ancho de pista (m)", "num"], ["smoothing", "Redondeo de curvas", "int"],
  ["ring_count", "Círculos de nitro", "int"], ["rock_count", "Rocas en la pista", "int"],
];

// Mapa en el editor: los puntos son {p:[x,z], in:[dx,dz]|null, out:[dx,dz]|null}
// (null = manija automática, como en el juego).
function nodeFrom(n) {
  if (Array.isArray(n)) return { p: [n[0], n[1]], in: null, out: null };
  return { p: [n.p[0], n.p[1]], in: n.in ? [n.in[0], n.in[1]] : null, out: n.out ? [n.out[0], n.out[1]] : null };

  // se escribe en la ventana del JSON (ahí deshace el texto, como siempre).
  const mod = e.metaKey || e.ctrlKey;
  const isZ = e.code === "KeyZ" || e.key.toLowerCase() === "z";
  const isY = e.code === "KeyY" || e.key.toLowerCase() === "y";
  if (mod && (isZ || isY) && !e.target.closest("textarea")) {
    e.preventDefault();
    if (e.target.closest("input, select")) e.target.blur();
    if (isZ && !e.shiftKey) undo(); else redo();
    return;
  }
  if (e.target.closest("input, textarea, select")) return;
  const k = e.key.toLowerCase();
  if (e.key === " ") { spaceDown = true; cv.style.cursor = "grab"; e.preventDefault(); return; }

  if (e.key === "Escape") { if (drawing) cancelDrawing(); else { sel = { kind: "map" }; refreshPanel(); draw(); } return; }

  if (map_[k]) setTool(map_[k]);
  if (k === "f") fit();
  if (k === "+" || k === "=") zoomAt([W / 2, H / 2], 1.25);
  if (k === "-") zoomAt([W / 2, H / 2], 0.8);

function field(label, kind, value, onChange, opts = {}) {

  const id = "f_" + (opts.id || label).replace(/[^a-z0-9]/gi, "_");
  const l = document.createElement("label"); l.textContent = label; l.htmlFor = id;
  const inp = document.createElement(kind === "choice" ? "select" : "input"); inp.id = id;
  if (kind === "choice") {

    inp.value = value;
  }

  else if (kind === "color") { inp.type = "color"; inp.value = (value || "#000000").slice(0, 7); }
  else if (kind === "text") { inp.type = "text"; inp.value = value ?? ""; }
  else { inp.type = "number"; inp.step = kind === "int" ? "1" : "any"; inp.value = value ?? ""; }
  inp.addEventListener("change", () => {
    let v = kind === "bool" ? inp.checked : kind === "color" || kind === "text" || kind === "choice" ? inp.value : Number(inp.value);
    if ((kind === "num" || kind === "int") && !Number.isFinite(v)) return;
    if (kind === "int") v = Math.round(v);
    onChange(v); commit(); refreshPanel();
  });
  inp.dataset.bind = opts.bind || "";

  return wrap;
}

    box.append(row);
    box.append(note("La línea fina es la que dibujás; la banda celeste es la pista tal como queda en el juego (con el redondeo). La flecha marca el sentido de la carrera."));
  } else if (s.kind === "island") {
    const isl = map.islands[s.i];
    title.textContent = `Isla ${s.i + 1}`;
    box.append(field("x (m)", "num", round(isl.x), (v) => (isl.x = v), { bind: "x" }));
    box.append(field("z (m)", "num", round(isl.z), (v) => (isl.z = v), { bind: "z" }));
    box.append(field("Radio (m)", "num", isl.radius, (v) => (isl.radius = Math.max(4, v)), { bind: "radius" }));
    box.append(field("Faro", "bool", isl.lighthouse, (v) => (isl.lighthouse = v)));
    box.append(field("Semilla palmeras", "int", isl.seed, (v) => (isl.seed = v)));
    box.append(btn("Borrar isla", deleteSelection));
  } else if (s.kind === "piece") {
    const p = map.pieces[s.i];
    const def = PIECES[p.type];
    title.textContent = def ? def.name : `Pieza "${p.type}"`;
    if ("x" in p) {
      box.append(field("x (m)", "num", round(p.x), (v) => (p.x = v), { bind: "x" }));
      box.append(field("z (m)", "num", round(p.z), (v) => (p.z = v), { bind: "z" }));
    }
    for (const [k, label, kind, d, choices] of def?.params || []) {
      let set = (v) => (p[k] = v);
      if (p.type === "light_string" && k === "lines") set = (v) => (p[k] = Math.max(1, Math.min(20, v)));
      box.append(field(label, kind, p[k] ?? d, set, { id: k, bind: k, choices }));
    }
    if (p.type === "rock_formation") {
      const { line, shapes } = computed();
      const cave = line.length > 2 && rockTouchesTrack(shapes[s.i], line);
      box.append(note(cave
        ? "Tapa la pista: es una cueva. Con el techo bajo, los saltos adentro son más bajos (nunca tocan el techo)."
        : "No toca la pista: es una roca de paisaje. Con \"Arco abajo\" se ve el mar a través."));
      const row = document.createElement("div"); row.className = "row";
      row.append(btn("Agujero en el techo", () => {
        const c = centroid(shapes[s.i]); p.skylights = p.skylights || []; p.skylights.push(c); sel.sky = p.skylights.length - 1; commit(); refreshPanel();
        toast("Agujero agregado en el medio: arrastralo a donde quieras.");
      }));
      box.append(row);
    }
    if (p.type === "tropical_island") box.append(note("Arena en toda la figura y selva adentro. Del lado que da a la pista va más tupida; atrás, más rala. Se choca como una isla."));
    if (p.type === "light_string") box.append(note("Cada cable sale atado a una palmera alta cerca de una punta y llega a otra cerca de la otra punta. De día se ven los focos de color; de noche (o al atardecer) se prenden. Arrastrá las puntas para moverlas."));
    if (p.type === "island_split") box.append(note("Cada isla tropical que la línea cruza de lado a lado queda partida en islas separadas, con mar en el medio. Si entra desde el mar sin cruzarla, le hace una bahía."));
    if (DRAWN[p.type] && s.node >= 0) {
      const row = document.createElement("div"); row.className = "row";
      const n = nodesOf(p)[s.node];
      row.append(btn("Esquina", () => { n.in = [0, 0]; n.out = [0, 0]; commit(); refreshPanel(); }),
        btn("Curva automática", () => { n.in = null; n.out = null; commit(); refreshPanel(); }));
      box.append(row);
    }
    if (!def) box.append(note("El editor no conoce esta pieza: se guarda tal cual."));
    box.append(btn(s.sky !== undefined && s.sky !== null ? "Borrar agujero" : s.node >= 0 ? "Borrar punto" : "Borrar pieza", deleteSelection));
  }
  refreshReview();
  updateButtons();
}
function refreshFieldsValues() {
  // Mientras se arrastra: actualizar números sin rearmar el panel.
  const s = sel; if (!s) return;
  const t = s.kind === "island" ? map.islands[s.i] : s.kind === "piece" ? map.pieces[s.i] : s.kind === "start" ? map.start : null;
  if (!t) return;
  document.querySelectorAll("#selFields input[data-bind]").forEach((inp) => {
    const b = inp.dataset.bind; if (b in t && typeof t[b] === "number") inp.value = round(t[b]);
  });
}
const round = (v) => Math.round(v * 10) / 10;
function lockedId() { return currentKey.startsWith("builtin:") || currentKey.startsWith("saved:"); }

// ---------------------------------------------------------------------------
// Revisión: lo mismo que revisan los tests del juego.
// ---------------------------------------------------------------------------
function review() {
  const out = [];
  const { line, shapes, length } = computed();
  if (map.path.length && map.path.length < (map.start ? 1 : 3)) out.push(["bad", "La pista necesita al menos 3 puntos."]);
  if (map.path.length && !map.start) out.push(["warn", "La pista no tiene recta de meta: los surfistas pueden arrancar mirando para cualquier lado si la largada está en una curva. Usá la herramienta Meta."]);
  if (!map.path.length && !map.islands.length) out.push(["bad", "Un mapa de anillo necesita una isla en el medio."]);
  if (line.length > 2) {
    map.islands.forEach((isl, i) => {
      const d = distToLine([isl.x, isl.z], line);
      if (d < map.half_width + isl.radius + 0.5) out.push(["bad", `La isla ${i + 1} pisa la pista.`]);
    });
    map.pieces.forEach((p, i) => {
      if (p.type === "volcano" && distToLine([p.x, p.z], line) < map.half_width + (p.radius ?? 40) + 0.5) out.push(["bad", "El volcán pisa la pista."]);
      if (p.type === "geyser" && distToLine([p.x, p.z], line) > map.half_width - 2) out.push(["warn", "Hay un géiser fuera de la pista: nadie va a pasar por arriba."]);
      if (p.type === "tropical_island" && shapes[i]?.length >= 3 && rockTouchesTrack(shapes[i], line))
        out.push(["bad", "Una isla tropical pisa la pista."]);
      if (p.type === "light_string" && p.a && p.b) {
        const isles = map.pieces.map((q, k) => (q.type === "tropical_island" ? shapes[k] : null));
        const ia = isles.findIndex((q) => q && q.length >= 3 && pointInPoly(p.a, q));
        const ib = isles.findIndex((q) => q && q.length >= 3 && pointInPoly(p.b, q));
        if (ia < 0 || ib < 0) out.push(["bad", "Una guirnalda tiene una punta fuera de una isla tropical."]);
        else if (ia === ib) out.push(["bad", "Una guirnalda tiene las dos puntas en la misma isla."]);
      }
      if (p.type === "island_split" && shapes[i]?.length >= 2) {
        const isles = map.pieces.map((q, k) => (q.type === "tropical_island" ? shapes[k] : null)).filter((q) => q && q.length >= 3);
        if (!shapes[i].some((pt) => isles.some((poly) => pointInPoly(pt, poly)))) out.push(["warn", "Hay un corte que no pasa por ninguna isla tropical: no divide nada."]);
      }
      if (p.type === "rock_formation" && shapes[i]?.length >= 3 && rockTouchesTrack(shapes[i], line) && (p.ceiling ?? 12) < 7)
        out.push(["warn", "Una cueva tiene el techo muy bajo (menos de 7 m): la cámara puede quedar dentro de la roca."]);
    });
    // Curvas demasiado cerradas (radio chico en la pista final).
    let tight = 0;
    for (let i = 0; i < line.length; i += 2) {
      const a = line[(i - 4 + line.length) % line.length], b = line[i], c = line[(i + 4) % line.length];
      const ab = dist(a, b), bc = dist(b, c), ac = dist(a, c);
      const area = Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])) / 2;
      if (area > 1e-6) { const R = (ab * bc * ac) / (4 * area); if (R < map.half_width * 0.6) tight++; }
    }
    if (tight) out.push(["warn", "Hay curvas muy cerradas: subí el redondeo o abrí las manijas."]);
    // La pista no se tiene que cruzar con sí misma (cerca de otro tramo que no es el vecino).
    let cross = false;
    const step = Math.max(1, Math.floor(line.length / 160));
    for (let i = 0; i < line.length && !cross; i += step) for (let j = i + 40; j < line.length - 40 + i && !cross; j += step) {
      const jj = j % line.length;
      if (Math.abs(jj - i) < 40 || line.length - Math.abs(jj - i) < 40) continue;
      if (dist(line[i], line[jj]) < map.half_width * 2) cross = true;
    }
    if (cross) out.push(["warn", "La pista pasa muy cerca de sí misma: los tramos se pueden tocar."]);
  }
  const taken = Object.values(BUILTIN).filter((b) => b.id !== map.id).map((b) => b.order);
  if (taken.includes(map.order)) out.push(["bad", `El número de mapa ${map.order} ya lo usa otro mapa del juego. Usá ${Math.max(...taken) + 1}.`]);
  if (!out.length) out.push(["ok", "Todo en orden para el juego."]);
  return { out, length };
}
function refreshReview() {
  const { out, length } = review();
  const geysers = map.pieces.filter((p) => p.type === "geyser").length;
  const caves = map.pieces.filter((p, i) => p.type === "rock_formation" && computed().line.length > 2 && computed().shapes[i]?.length >= 3 && rockTouchesTrack(computed().shapes[i], computed().line)).length;
  $("stats").innerHTML = "";
  for (const [v, l] of [[Math.round(length), "m por vuelta"], [map.islands.length, "islas"], [caves, caves === 1 ? "cueva" : "cuevas"], [map.laps, "vueltas"], [map.path.length, "puntos"], [geysers, "géiseres"]]) {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = v; const sp = document.createElement("span"); sp.textContent = l;
    d.append(b, sp); $("stats").append(d);
  }
  const ul = $("warns"); ul.innerHTML = "";
  for (const [lvl, text] of out) {
    const li = document.createElement("li");
    const pill = document.createElement("span"); pill.className = "pill " + lvl; pill.textContent = lvl === "bad" ? "Error" : lvl === "warn" ? "Ojo" : "Bien";
    const t = document.createElement("span"); t.textContent = text;
    li.append(pill, t); ul.append(li);
  }
}

// ---------------------------------------------------------------------------
// Abrir, importar, exportar y guardar para el juego
// ---------------------------------------------------------------------------
const saved = new Map();
function fillPicker() {
  const pk = $("mapPicker"); pk.innerHTML = "";
  const g1 = document.createElement("optgroup"); g1.label = "Mapas del juego";
  BUILTIN.forEach((b, i) => { const o = document.createElement("option"); o.value = "builtin:" + i; o.textContent = cap(b.name); g1.append(o); });
  pk.append(g1);
  if (saved.size) {
    const g2 = document.createElement("optgroup"); g2.label = "Guardados";
    for (const [id, d] of saved) { const o = document.createElement("option"); o.value = "saved:" + id; o.textContent = cap(d.name || id); g2.append(o); }
    pk.append(g2);
  }
  const o = document.createElement("option"); o.value = "new"; o.textContent = "+ Mapa nuevo"; pk.append(o);
  if (currentKey === "draft") { const od = document.createElement("option"); od.value = "draft"; od.textContent = `Borrador: ${cap(map.name)}`; pk.prepend(od); }
  pk.value = currentKey;
}
const cap = (t) => (t ? t[0].toUpperCase() + t.slice(1) : t);
function openMap(key) {
  if (key === "new") {
    const next = Math.max(...BUILTIN.map((b) => b.order), ...[...saved.values()].map((d) => d.order ?? 0)) + 1;
    map = fromJSON({ id: "mapa_nuevo", name: "mapa nuevo", order: next, laps: 3, half_width: 20, smoothing: 20, ring_count: 12, rock_count: 10, path: [], islands: [], pieces: [] });
    currentKey = "draft"; setTool("track");
  } else if (key.startsWith("builtin:")) { map = fromJSON(BUILTIN[+key.slice(8)]); currentKey = key; }
  else if (key.startsWith("saved:")) { map = fromJSON(saved.get(key.slice(6))); currentKey = key; }
  sel = { kind: "map" }; drawing = null;
  resetHistory(); fillPicker(); invalidate(); refreshPanel(); fit(); saveDraft();
}
$("mapPicker").addEventListener("change", (e) => openMap(e.target.value));

function showJSON() {
  $("jsonTitle").textContent = "JSON del mapa";
  $("jsonNote").textContent = `Este es el archivo del mapa, tal como lo lee el juego (world/maps/${toJSON(map).id}.json).`;
  $("jsonText").value = prettyJSON(toJSON(map)); $("jsonText").readOnly = true;
  $("jsonLoad").hidden = true; $("jsonCopy").hidden = false; $("jsonDownload").hidden = false;
  $("jsonDlg").showModal();
}
function showImport() {
  $("jsonTitle").textContent = "Importar un mapa";
  $("jsonNote").textContent = "Pegá acá el JSON de un mapa (por ejemplo un archivo de world/maps/).";
  $("jsonText").value = ""; $("jsonText").readOnly = false;
  $("jsonLoad").hidden = false; $("jsonCopy").hidden = true; $("jsonDownload").hidden = true;
  $("jsonDlg").showModal(); $("jsonText").focus();
}
$("exportBtn").onclick = showJSON;
$("importBtn").onclick = showImport;
$("jsonLoad").onclick = () => {
  try {
    const d = JSON.parse($("jsonText").value);
    if (!d || typeof d !== "object" || (!d.path && !d.islands)) throw new Error("no parece un mapa");
    map = fromJSON(d); currentKey = "draft"; sel = { kind: "map" };
    resetHistory(); fillPicker(); invalidate(); refreshPanel(); fit(); saveDraft();
    $("jsonDlg").close(); toast("Mapa importado.");
  } catch (err) { toast("No se pudo leer: " + err.message); }
};
$("jsonCopy").onclick = async () => {
  const ta = $("jsonText");
  try { await navigator.clipboard.writeText(ta.value); toast("JSON copiado."); }
  catch { ta.focus(); ta.select(); toast("Seleccionado: copialo con Ctrl+C."); }
};
$("downloadBtn").onclick = async () => {
  if (drawing) finishDrawing();
  const errs = review().out.filter((r) => r[0] === "bad");
  if (errs.length) { toast("Primero arreglá los errores de la revisión (si no, GitHub no lo publica)."); return; }
  await downloadMap();
};
$("jsonDownload").onclick = () => downloadMap();
async function downloadMap() {
  const d = toJSON(map);
  try {
    const dl = await window.claude?.use?.("downloads");
    if (!dl) throw { code: "unavailable" };
    await dl.save({ filename: `${d.id}.json`, data: prettyJSON(d) + "\n" });
    toast(`Listo: ${d.id}.json. Subilo a world/maps/ en GitHub (ver COMO_SUBIR_UN_MAPA.md).`);
  } catch (err) {
    if (err?.code === "declined") return;
    showJSON();
    toast("Acá no se puede descargar: copiá el JSON y guardalo como " + d.id + ".json.");
  }
}

async function saveForGame() {
  const errs = review().out.filter((r) => r[0] === "bad");
  if (errs.length) { toast("Primero arreglá los errores de la revisión."); return; }
  if (drawing) finishDrawing();
  const d = toJSON(map);
  if (!db) { showJSON(); toast("No se pudo guardar acá: copiá el JSON y pasáselo a Claude."); return; }
  try {
    await db.collection("maps").doc(d.id).set({ id: d.id, name: d.name, order: d.order, json: prettyJSON(d), updated: new Date().toISOString() });
    currentKey = "saved:" + d.id;
    toast(`Guardado "${cap(d.name)}". Avisale a Claude que lo agregue al juego.`);
  } catch (err) {
    showJSON(); toast("No se pudo guardar (" + (err?.code || "error") + "): copiá el JSON.");
  }
}
$("saveBtn").onclick = saveForGame;

function renderSaved() {
  const box = $("savedList"); box.innerHTML = "";
  if (!db) { box.append(note("Guardar para el juego no está disponible en esta vista. Usá Ver JSON y copiáselo a Claude.")); return; }
  if (!saved.size) { box.append(note("Todavía no guardaste ninguno. Cuando un mapa esté listo, tocá Guardar para el juego y avisale a Claude.")); return; }
  for (const [id, d] of saved) {
    const b = document.createElement("button"); b.type = "button";
    const n = document.createElement("span"); n.textContent = cap(d.name || id);
    const t = document.createElement("small"); t.textContent = (d.updated || "").slice(0, 10) + ` · #${d.order}`;
    b.append(n, t); b.onclick = () => openMap("saved:" + id);
    box.append(b);
  }
}
async function connectDb() {
  const timer = setTimeout(() => { if (!db) renderSaved(); }, 10000);
  try {
    db = await window.claude?.use?.("db");
  } catch { db = null; }
  clearTimeout(timer);
  if (!db) { renderSaved(); return; }
  db.collection("maps").onSnapshot((snap) => {
    saved.clear();
    snap.docs.forEach((doc) => { try { const d = doc.data(); const m = JSON.parse(d.json); saved.set(doc.id, { ...m, updated: d.updated }); } catch {} });
    renderSaved(); fillPicker();
  }, () => renderSaved());
}

// Borrador local (por si se cierra la página).
function saveDraft() { try { localStorage.setItem("simplesurf-editor-draft", JSON.stringify({ key: currentKey, map: toJSON(map) })); } catch {} }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem("simplesurf-editor-draft") || "null");
    if (d?.map) { map = fromJSON(d.map); currentKey = d.key?.startsWith("builtin:") ? d.key : "draft"; return true; }
  } catch {}
  return false;
}

let toastTimer = 0;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200); }

// ---------------------------------------------------------------------------
// Arranque: abre el archipiélago (o el borrador que quedó).
// ---------------------------------------------------------------------------
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
loadDraft();
resetHistory();
fillPicker();
sel = { kind: "map" };
setTool("select");
requestAnimationFrame(() => { resize(); fit(); });
document.fonts?.ready.then(draw);
connectDb();
</script>
