<title>Editor de mapas SimpleSurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: carta náutica a pantalla completa; herramientas a la izquierda, propiedades a la derecha (en el teléfono, apiladas). */
:root {
  --bg: #e9f0f3;
  --panel: #ffffff;
  --panel-2: #f4f8fa;
  --ink: #10232e;
  --muted: #587080;
  --line: #d2dde3;
  --accent: #f0603f;
  --accent-ink: #ffffff;
  --sel: #ff9f1c;
  --ok: #2c8a57;
  --warn: #b86e00;
  --bad: #c2392d;
  --sea-out: #0f4f73;
  --sea-in: #1f86ae;
  --lane: #5cc3d8;
  --rope: #f6f1e4;
  --sand: #efd49b;
  --grass: #74c15c;
  --rock: #8b6a55;
  --cave: #0e6f74;
  --glow: #2fe3c8;
  --grid: rgba(255, 255, 255, 0.07);
  --f-display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a141a; --panel: #101d25; --panel-2: #142530; --ink: #e2edf2; --muted: #8ba2ae; --line: #22363f;
    --accent: #ff7a5c; --accent-ink: #1a0b06; --sel: #ffb347; --ok: #4cc283; --warn: #f0a63a; --bad: #ff6b5e;
    --sea-out: #08324a; --sea-in: #135f80; --lane: #3aa3ba; --rope: #d9d2c0; --grid: rgba(255, 255, 255, 0.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a141a; --panel: #101d25; --panel-2: #142530; --ink: #e2edf2; --muted: #8ba2ae; --line: #22363f;
  --accent: #ff7a5c; --accent-ink: #1a0b06; --sel: #ffb347; --ok: #4cc283; --warn: #f0a63a; --bad: #ff6b5e;
  --sea-out: #08324a; --sea-in: #135f80; --lane: #3aa3ba; --rope: #d9d2c0; --grid: rgba(255, 255, 255, 0.05);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand span { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 11px; line-height: 1;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
select.btn { padding-right: 8px; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 56px 1fr 300px; gap: 10px; }
.tools { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.tool {
  width: 42px; height: 42px; border-radius: 9px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; position: relative; color: var(--ink);
}
.tool:hover { background: var(--panel-2); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tool svg { width: 22px; height: 22px; }
.tool .key { position: absolute; right: 3px; bottom: 2px; font: 500 9px var(--f-mono); opacity: 0.6; }
.tools hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

.stage { position: relative; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sea-out); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint {
  position: absolute; left: 10px; bottom: 10px; right: 10px; pointer-events: none; display: flex; justify-content: space-between; gap: 10px; align-items: end;
}
.hint .msg { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 60ch; font-size: 12.5px; }
.hint .coords { font: 12px var(--f-mono); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 34px; height: 34px; justify-content: center; padding: 0; }

aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; color: var(--muted); }
.field { display: grid; grid-template-columns: 1fr 108px; gap: 8px; align-items: center; }
.field label { font-size: 13px; min-width: 0; }
.field input[type="number"], .field input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--panel-2); font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.field input[type="color"] { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 2px; }
.field input[type="checkbox"] { justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0; }
.warns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.warns li { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 12.5px; line-height: 1.4; }
.pill { font: 600 10px var(--f-body); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 99px; align-self: start; }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 8px; }
.stat b { display: block; font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(5, 15, 20, 0.5); }
.dlg { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dlg h3 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.dlg textarea { width: 100%; min-height: 260px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font: 12px/1.45 var(--f-mono); padding: 10px; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 13px; z-index: 20; }
.saved-list { display: flex; flex-direction: column; gap: 4px; }
.saved-list button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 9px; display: flex; justify-content: space-between; gap: 8px; }
.saved-list small { color: var(--muted); font-family: var(--f-mono); }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 62vh auto; }
  .tools { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .tools hr { border-top: 0; border-left: 1px solid var(--line); margin: 2px 4px; }
  aside { overflow: visible; }
  .hint .msg { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="brand"><h1>Editor de mapas</h1><span>SimpleSurf · vista desde arriba, en metros</span></div>
  <div class="row">
    <select class="btn" id="mapPicker" aria-label="Abrir un mapa"></select>
    <button class="btn" id="undoBtn" title="Deshacer (Ctrl+Z)">Deshacer</button>
    <button class="btn" id="redoBtn" title="Rehacer (Ctrl+Shift+Z)">Rehacer</button>
    <button class="btn" id="importBtn">Importar</button>
    <button class="btn" id="exportBtn">Ver JSON</button>
    <button class="btn" id="downloadBtn" title="Baja el archivo del mapa para subirlo a world/maps/ en GitHub">Descargar mapa</button>
    <button class="btn primary" id="saveBtn" title="Lo deja guardado para que Claude lo agregue al juego">Guardar para el juego</button>
  </div>
</header>

<div class="app">
  <nav class="tools" aria-label="Herramientas">
    <button class="tool" data-tool="select" title="Seleccionar y mover (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span class="key">V</span></button>
    <button class="tool" data-tool="pan" title="Mover la vista (H o espacio)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 12V6a1.5 1.5 0 013 0v5M11 11V4.5a1.5 1.5 0 013 0V11M14 11V6a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7s-5-2-6.5-5L3.8 12a1.4 1.4 0 012.3-1.6L8 13"/></svg><span class="key">H</span></button>
    <hr>
    <button class="tool" data-tool="paint" title="Pintar pista: pintá el recorrido con el pincel y el editor lo pasa a pista (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L11 18l-5-5z"/><path d="M6 13c-2 0-3 1.5-3 3.5S2 20 2 20s3.5.5 5-1 1-3 1-3"/></svg><span class="key">D</span></button>
    <button class="tool" data-tool="track" title="Pista: clic pone un punto, arrastrar hace curva (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18c3-9 6 2 9-6s5-4 7-6"/><circle cx="4" cy="18" r="1.8" fill="currentColor"/><circle cx="20" cy="6" r="1.8" fill="currentColor"/></svg><span class="key">P</span></button>
    <button class="tool" data-tool="branch" title="Camino alternativo: tocá un punto de la pista, poné los puntos del camino y tocá el punto donde vuelve (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h3c3 0 4-6 7-6h1M7 12c3 0 4 6 7 6h1M15 6c2 0 3 6 5 6M15 18c2 0 3-6 5-6"/><circle cx="4" cy="12" r="1.8" fill="currentColor"/><circle cx="20" cy="12" r="1.8" fill="currentColor"/></svg><span class="key">B</span></button>
    <button class="tool" data-tool="rock_formation" title="Roca o cueva: dibujá la figura (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 19l3-8 4-3 3 2 3-5 5 14z"/><path d="M9 19c0-3 1.5-5 3-5s3 2 3 5" /></svg><span class="key">R</span></button>
    <button class="tool" data-tool="start" title="Meta: una recta con la largada (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h12l-2 4 2 4H6"/><path d="M10 4v8M14 4v8" stroke-dasharray="2 2"/></svg><span class="key">M</span></button>
    <button class="tool" data-tool="tropical_island" title="Isla tropical: dibujá la figura (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18c3-3 6-2 9-3s6-3 9-1"/><path d="M8 15V9m0 0c-2-2-4-1.5-5 0m5 0c1.5-2 3.5-2 5-.5M15 14V8m0 0c-1.5-1.8-3.5-1.5-4.5 0m4.5 0c1.5-2 3.5-1.8 4.5-.2" stroke-linecap="round"/></svg><span class="key">T</span></button>
    <button class="tool" data-tool="island_split" title="Dividir isla: dibujá una línea que cruce una isla tropical y queda partida en dos, con mar en el medio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9c2-4 5-5 7-4v14c-3 1-6 0-7-4z"/><path d="M14 5c2-1 5 0 7 4v6c-1 4-4 5-7 4z"/><path d="M12 2v20" stroke-dasharray="2 2"/></svg></button>
    <button class="tool" data-tool="light_string" title="Guirnalda de luces: tocá una isla tropical y después otra (de noche se prenden)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6c5 6 13 6 18 0"/><circle cx="7" cy="10" r="1.6" fill="currentColor"/><circle cx="12" cy="11.5" r="1.6" fill="currentColor"/><circle cx="17" cy="10" r="1.6" fill="currentColor"/><path d="M3 4v16M21 4v16"/></svg></button>
    <button class="tool" data-tool="island" title="Isla tropical redonda (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="16" rx="8" ry="3.5"/><path d="M12 15V8m0 0c-2-2-4-2-5-1m5 1c2-2 4-2 5-1m-5 1c-1-2-1-3.5 0-4.5"/></svg><span class="key">I</span></button>
    <hr>
    <button class="tool" data-tool="geyser" title="Géiser (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="19" rx="6" ry="2"/><path d="M12 17V6m-3 4l3-4 3 4M8 13c-1-2 0-4 1-5m7 5c1-2 0-4-1-5"/></svg><span class="key">G</span></button>
    <button class="tool" data-tool="rock_arch" title="Arco de roca (paisaje)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20V12a9 9 0 0118 0v8h-4v-8a5 5 0 00-10 0v8z"/></svg></button>
    <button class="tool" data-tool="waterfall" title="Cascada (ponela en la salida de una cueva, cruzando la pista)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h16M7 4v12M11 4v14M15 4v12M19 4v10"/><path d="M4 20c2-1.5 4-1.5 6 0s4 1.5 6 0 3-1 4-.5"/></svg></button>
    <button class="tool" data-tool="shipwreck" title="Barco hundido (paisaje)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 15h18l-3 5H6z"/><path d="M11 15V4l6 7h-6"/></svg></button>
  </nav>

  <div class="stage">
    <canvas id="cv" aria-label="Mapa"></canvas>
    <div class="zoom">
      <button class="btn" id="zoomIn" aria-label="Acercar">+</button>
      <button class="btn" id="zoomOut" aria-label="Alejar">−</button>
      <button class="btn" id="zoomFit" aria-label="Ver todo el mapa" title="Ver todo (F)">⤢</button>
    </div>
    <div class="hint"><div class="msg" id="hint"></div><div class="coords" id="coords">x 0 · z 0</div></div>
  </div>

  <aside>
    <section id="selSection">
      <h2 id="selTitle">Mapa</h2>
      <div id="selFields"></div>
    </section>
    <section>
      <h2>Revisión</h2>
      <div class="stats" id="stats"></div>
      <ul class="warns" id="warns"></ul>
    </section>
    <section>
      <h2>Guardados para el juego</h2>
      <div class="saved-list" id="savedList"><p class="note">Cargando…</p></div>
    </section>
  </aside>
</div>

<dialog id="jsonDlg">
  <form method="dialog" class="dlg">
    <h3 id="jsonTitle">JSON del mapa</h3>
    <p class="note" id="jsonNote">Este es el archivo del mapa, tal como lo lee el juego (world/maps/).</p>
    <textarea id="jsonText" spellcheck="false"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="jsonCopy" type="button">Copiar</button>
      <button class="btn" id="jsonDownload" type="button">Descargar .json</button>
      <button class="btn primary" id="jsonLoad" type="button" hidden>Abrir este mapa</button>
      <button class="btn" value="close">Cerrar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Datos: mismo formato que world/maps/*.json del juego.
// ---------------------------------------------------------------------------
const BUILTIN = /*MAPS*/;

// Piezas que entiende el juego. Salen del código del juego: cada pieza de
// world/pieces/*.gd dice cómo se ve acá (su constante EDITOR; ver
// MapPiece.editor_entry) y build.py mete el catálogo. Una pieza nueva aparece
// sola, sin tocar este archivo. params: [nombre, etiqueta, campo, valor por
// defecto (si el mapa no lo dice, el juego usa este), opciones?].
const CATALOG = /*PIECES*/;
const PIECES = {};
// Piezas que se dibujan con puntos y manijas: dónde guardan los puntos y si la
// figura es cerrada (roca, isla) o un camino abierto (corte que divide islas).
const DRAWN = {};
// Parámetros que el juego exige aunque tengan el valor de siempre.
const REQUIRED = {};
for (const c of CATALOG) {
  PIECES[c.type] = c;
  if (c.place === "shape" || c.place === "path") DRAWN[c.type] = { key: c.key, closed: c.place === "shape", tool: c.type, label: c.what || "una figura" };
  REQUIRED[c.type] = c.required || [];
}
const GEYSER_RADIUS = 4;
const nodesOf = (p) => p[DRAWN[p.type].key];
const isClosed = (p) => DRAWN[p.type]?.closed !== false;

const MAP_FIELDS = [
  ["name", "Nombre en el menú", "text"], ["order", "Número de mapa", "int"], ["laps", "Vueltas", "int"],
  ["half_width", "Mitad del ancho de pista (m)", "num"], ["smoothing", "Redondeo de curvas", "int"],
  ["ring_count", "Círculos de nitro", "int"], ["rock_count", "Rocas en la pista", "int"],
];

// Mapa en el editor: los puntos son {p:[x,z], in:[dx,dz]|null, out:[dx,dz]|null}
// (null = manija automática, como en el juego).
function nodeFrom(n) {
  if (Array.isArray(n)) return { p: [n[0], n[1]], in: null, out: null };
  return { p: [n.p[0], n.p[1]], in: n.in ? [n.in[0], n.in[1]] : null, out: n.out ? [n.out[0], n.out[1]] : null };
}
function nodeTo(n) {
  const r = (v) => Math.round(v * 1000) / 1000;
  if (!n.in && !n.out) return [r(n.p[0]), r(n.p[1])];
  const o = { p: [r(n.p[0]), r(n.p[1])] };
  if (n.in) o.in = [r(n.in[0]), r(n.in[1])];
  if (n.out) o.out = [r(n.out[0]), r(n.out[1])];
  return o;
}
// Isla tropical redonda (centro, radio): 8 puntos con manijas de círculo.
function roundIsland(c, radius) {
  const n = 8, k = (4 / 3) * Math.tan(Math.PI / (2 * n)) * radius, r3 = (v) => Math.round(v * 1000) / 1000;
  const shape = [];
  for (let i = 0; i < n; i++) {
    const a = (2 * Math.PI * i) / n, t = [-Math.sin(a) * k, Math.cos(a) * k];
    shape.push({ p: [r3(c[0] + Math.cos(a) * radius), r3(c[1] + Math.sin(a) * radius)], in: [r3(-t[0]), r3(-t[1])], out: [r3(t[0]), r3(t[1])] });
  }
  const p = { type: "tropical_island", shape };
  for (const [key, , , def] of PIECES.tropical_island.params) p[key] = def;
  p.shape_seed = Math.floor(Math.random() * 99999) + 1;
  return p;
}
function fromJSON(d) {
  const m = {
    format: 1, id: d.id || "", name: d.name || d.id || "mapa nuevo", order: d.order ?? 3, laps: d.laps ?? 3,
    half_width: d.half_width ?? 20, ring_count: d.ring_count ?? 10, rock_count: d.rock_count ?? 12,
    smoothing: d.smoothing ?? 60, ring_radius: d.ring_radius ?? 82,
    // Pista anillo: solo si el mapa lo es de verdad (sin recorrido y con radio).
    // Un mapa nuevo arranca vacío.

function rasterPaint(strokes, hw) {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const st of strokes) if (!st.erase) for (const p of st.pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); }
  if (!Number.isFinite(x0)) return null;
  let cell = Math.min(4, Math.max(1.5, hw / 6));
  const pad = hw * 1.6 + 8;
  x0 -= pad; z0 -= pad; x1 += pad; z1 += pad;
  while (((x1 - x0) / cell) * ((z1 - z0) / cell) > 2.5e6) cell *= 1.25;
  const W = Math.ceil((x1 - x0) / cell) + 1, H = Math.ceil((z1 - z0) / cell) + 1;
  const g = new Uint8Array(W * H);
  const stamp = (cx, cz, r, v) => {
    const gx = (cx - x0) / cell, gz = (cz - z0) / cell, rr = r / cell, r2 = rr * rr;
    for (let y = Math.max(0, Math.floor(gz - rr)); y <= Math.min(H - 1, Math.ceil(gz + rr)); y++)
      for (let x = Math.max(0, Math.floor(gx - rr)); x <= Math.min(W - 1, Math.ceil(gx + rr)); x++)
        if ((x - gx) * (x - gx) + (y - gz) * (y - gz) <= r2) g[y * W + x] = v;
  };
  for (const st of strokes) {
    const r = st.erase ? hw * 1.2 : hw, v = st.erase ? 0 : 1, pts = st.pts;
    stamp(pts[0][0], pts[0][1], r, v);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], d = dist(a, b), n = Math.max(1, Math.ceil(d / (r * 0.35)));
      for (let k = 1; k <= n; k++) stamp(a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n, r, v);
    }
  }
  // Agujeritos que quedan entre trazos (no son islas): se rellenan.
  const seen = new Uint8Array(W * H), q = [];
  for (let x = 0; x < W; x++) for (const y of [0, H - 1]) if (!g[y * W + x]) { seen[y * W + x] = 1; q.push(y * W + x); }
  for (let y = 0; y < H; y++) for (const x of [0, W - 1]) if (!g[y * W + x] && !seen[y * W + x]) { seen[y * W + x] = 1; q.push(y * W + x); }
  while (q.length) {
    const i = q.pop(), x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx;
      if (!g[j] && !seen[j]) { seen[j] = 1; q.push(j); }
    }
  }
  const maxHole = (3 * hw * 3 * hw) / (cell * cell);
  for (let i = 0; i < W * H; i++) {
    if (g[i] || seen[i]) continue;
    const comp = [i]; seen[i] = 1;
    for (let k = 0; k < comp.length; k++) {
      const c = comp[k], x = c % W, y = (c / W) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const j = (y + dy) * W + x + dx;
        if (!g[j] && !seen[j]) { seen[j] = 1; comp.push(j); }
      }
    }
    if (comp.length < maxHole) for (const c of comp) g[c] = 1;
  }
  return { g, W, H, x0, z0, cell };
}

// Afinar hasta la línea del medio (Zhang-Suen).
function thin(r) {
  const { W, H } = r, g = r.g.slice();
  const N = (i) => [g[i - W], g[i - W + 1], g[i + 1], g[i + W + 1], g[i + W], g[i + W - 1], g[i - 1], g[i - W - 1]];
  let changed = true;
  while (changed) {
    changed = false;
    for (const step of [0, 1]) {
      const del = [];
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (!g[i]) continue;
        const p = N(i);
        const b = p[0] + p[1] + p[2] + p[3] + p[4] + p[5] + p[6] + p[7];
        if (b < 2 || b > 6) continue;
        let a = 0;
        for (let k = 0; k < 8; k++) if (!p[k] && p[(k + 1) % 8]) a++;
        if (a !== 1) continue;
        if (step === 0 ? p[0] * p[2] * p[4] || p[2] * p[4] * p[6] : p[0] * p[2] * p[6] || p[0] * p[4] * p[6]) continue;
        del.push(i);
      }
      for (const i of del) g[i] = 0;
      if (del.length) changed = true;
    }
  }
  return g;
}

// El esqueleto como grafo: nudos (donde se juntan 3 o más) y tramos (líneas).
function skeletonGraph(r, sk, hw) {
  const { W, H, x0, z0, cell } = r;
  const OFF = [-W, -W + 1, 1, W + 1, W, W - 1, -1, -W - 1];
  const world = (i) => [x0 + (i % W) * cell, z0 + ((i / W) | 0) * cell];
  const pix = [];
  for (let i = 0; i < W * H; i++) if (sk[i]) pix.push(i);
  const nbs = (i) => OFF.map((o) => i + o).filter((j) => sk[j]);
  // Nudos: píxeles con 3 o más ramas alrededor.
  const zoneDist = new Float32Array(W * H).fill(Infinity);
  const q = [];
  for (const i of pix) {
    let t = 0;
    for (let k = 0; k < 8; k++) if (!sk[i + OFF[k]] && sk[i + OFF[(k + 1) % 8]]) t++;
    if (t >= 3) { zoneDist[i] = 0; q.push(i); }
  }
  // Zona de cada nudo: los píxeles del esqueleto a menos de R (así un nudo
  // "gordo" o dos muy juntos quedan como uno).
  const R = (hw * 1.1) / cell;
  for (let k = 0; k < q.length; k++) {
    const i = q[k];
    for (const o of OFF) {
      const j = i + o;
      if (!sk[j]) continue;
      const d = zoneDist[i] + (o === 1 || o === -1 || o === W || o === -W ? 1 : 1.414);
      if (d <= R && d < zoneDist[j]) { zoneDist[j] = d; q.push(j); }
    }
  }
  const zone = new Int32Array(W * H).fill(-1);
  const nodes = [];
  for (const i of pix) {
    if (zoneDist[i] === Infinity || zone[i] >= 0) continue;
    const id = nodes.length, comp = [i];
    zone[i] = id;
    for (let k = 0; k < comp.length; k++) for (const j of nbs(comp[k])) if (zoneDist[j] !== Infinity && zone[j] < 0) { zone[j] = id; comp.push(j); }
    let sx = 0, sz = 0;
    for (const c of comp) { const w = world(c); sx += w[0]; sz += w[1]; }
    nodes.push({ id, pos: [sx / comp.length, sz / comp.length], alive: true });
  }
  // Tramos: lo que queda fuera de los nudos.
  const edges = [];
  const used = new Uint8Array(W * H);
  for (const i0 of pix) {
    if (zone[i0] >= 0 || used[i0]) continue;
    const comp = [i0];
    used[i0] = 1;
    for (let k = 0; k < comp.length; k++) for (const j of nbs(comp[k])) if (zone[j] < 0 && !used[j]) { used[j] = 1; comp.push(j); }
    const inComp = new Set(comp);
    const inner = (i) => nbs(i).filter((j) => inComp.has(j));
    const touch = (i) => { for (const j of nbs(i)) if (zone[j] >= 0) return zone[j]; return null; };
    let ends = comp.filter((i) => inner(i).length < 2);
    const closed = ends.length === 0;
    if (comp.length < 2 && !nbs(i0).some((j) => zone[j] >= 0)) continue;
    // Recorrido ordenado desde una punta (o desde cualquier lado si es una vuelta).
    const start = closed ? comp[0] : ends[0];
    const order = [start], vis = new Set([start]);
    for (;;) {
      const cur = order[order.length - 1];
      const nx = inner(cur).filter((j) => !vis.has(j));
      if (!nx.length) break;
      nx.sort((a, b) => (Math.abs(a - cur) === 1 || Math.abs(a - cur) === W ? 0 : 1) - (Math.abs(b - cur) === 1 || Math.abs(b - cur) === W ? 0 : 1));
      vis.add(nx[0]); order.push(nx[0]);
    }
    let pts = order.map(world);
    // Suavizar los escalones de la grilla.
    for (let it = 0; it < 3; it++) pts = pts.map((p, k) => (k === 0 || k === pts.length - 1) && !closed ? p
      : [(pts[(k - 1 + pts.length) % pts.length][0] + 2 * p[0] + pts[(k + 1) % pts.length][0]) / 4, (pts[(k - 1 + pts.length) % pts.length][1] + 2 * p[1] + pts[(k + 1) % pts.length][1]) / 4]);
    const a = closed ? null : touch(order[0]);
    const b = closed ? null : touch(order[order.length - 1]);
    if (a !== null) pts.unshift(nodes[a].pos.slice());
    if (b !== null) pts.push(nodes[b].pos.slice());
    edges.push({ a, b, pts, closed, alive: true });
  }
  // Nudos que se tocan directamente (sin tramo en el medio): un tramo cortito.
  return { nodes, edges };
}

function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]); return s; }
// Dirección con la que un tramo sale de su punta (start = desde pts[0]).
function edgeDir(e, atStart, reach) {
  const pts = atStart ? e.pts : e.pts.slice().reverse();
  let s = 0, k = 1;
  for (; k < pts.length - 1 && s < reach; k++) s += dist(pts[k - 1], pts[k]);
  const d = sub(pts[Math.min(k, pts.length - 1)], pts[0]), l = len(d) || 1;
  return [d[0] / l, d[1] / l];
}

// Limpia el grafo: saca puntitas sueltas, junta nudos pegados, resuelve los
// cruces (X) y une los tramos que pasan por un nudo de solo dos.
function tidyGraph(G, hw) {
  const { nodes, edges } = G;
  let crossings = 0;
  const live = () => edges.filter((e) => e.alive);
  const endsAt = (n) => { const out = []; for (const e of live()) { if (e.a === n) out.push([e, true]); if (e.b === n) out.push([e, false]); } return out; };
  // Une dos puntas de tramos en el nudo n (la primera llega, la segunda sale).
  const join = (n, [e1, s1], [e2, s2]) => {
    const p1 = s1 ? e1.pts.slice().reverse() : e1.pts.slice();
    const other1 = s1 ? e1.b : e1.a;
    e1.alive = false;
    if (e1 === e2) { edges.push({ a: null, b: null, pts: p1.slice(0, -1), closed: true, alive: true }); return; }
    const p2 = s2 ? e2.pts.slice() : e2.pts.slice().reverse();
    const other2 = s2 ? e2.b : e2.a;
    e2.alive = false;
    edges.push({ a: other1, b: other2, pts: p1.concat(p2.slice(1)), closed: false, alive: true });
  };
  for (let round = 0; round < 40; round++) {
    let changed = false;
    // 1. Puntitas sueltas (un borde del pincel, un trazo que se pasó).
    for (const e of live()) {
      if (e.closed) continue;
      const dead = (e.a === null) !== (e.b === null);
      if ((dead && polyLen(e.pts) < hw * 3) || (e.a === null && e.b === null && polyLen(e.pts) < hw * 3)) { e.alive = false; changed = true; }
    }
    // 2. Nudos pegados (un tramo cortito entre dos nudos): uno solo.
    for (const e of live()) {
      if (e.closed || e.a === null || e.b === null || e.a === e.b || polyLen(e.pts) > hw * 1.6) continue;
      const A = nodes[e.a], B = nodes[e.b];
      A.pos = mul(add(A.pos, B.pos), 0.5); B.alive = false; e.alive = false;
      for (const f of live()) { if (f.a === B.id) { f.a = A.id; f.pts[0] = A.pos.slice(); } if (f.b === B.id) { f.b = A.id; f.pts[f.pts.length - 1] = A.pos.slice(); } }
      for (const f of live()) { if (f.a === A.id) f.pts[0] = A.pos.slice(); if (f.b === A.id) f.pts[f.pts.length - 1] = A.pos.slice(); }
      changed = true; break;
    }
    if (changed) continue;
    // 3. Cruces: cuatro tramos que siguen derecho de a pares.
    for (const n of nodes) {
      if (!n.alive) continue;
      const ends = endsAt(n.id);
      if (ends.length !== 4) continue;
      const dirs = ends.map(([e, s]) => edgeDir(e, s, hw * 2.5));
      let best = null;
      for (const [[i, j], [k, l]] of [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]) {
        const st = Math.min(-(dirs[i][0] * dirs[j][0] + dirs[i][1] * dirs[j][1]), -(dirs[k][0] * dirs[l][0] + dirs[k][1] * dirs[l][1]));
        if (!best || st > best.st) best = { st, pairs: [[i, j], [k, l]] };
      }
      if (best.st < 0.55) continue;
      n.alive = false;
      const [[i, j], [k, l]] = best.pairs;
      // Si las dos parejas son el mismo tramo, ya no hay nada que unir.
      join(n.id, ends[i], ends[j]);
      const e3 = ends[k], e4 = ends[l];
      if (!e3[0].alive || !e4[0].alive) {
        // Algún tramo ya se unió (un tramo que vuelve al mismo nudo): se busca de nuevo.
        const again = endsAt(n.id);
        if (again.length === 2) join(n.id, again[0], again[1]);
      } else join(n.id, e3, e4);
      crossings++; changed = true; break;
    }
    if (changed) continue;
    // 4. Nudos con solo dos tramos: no son nudos.
    for (const n of nodes) {
      if (!n.alive) continue;
      const ends = endsAt(n.id);
      if (ends.length === 2 && !(ends[0][0] === ends[1][0])) { n.alive = false; join(n.id, ends[0], ends[1]); changed = true; break; }
      if (ends.length === 0) { n.alive = false; changed = true; }
    }
    if (!changed) break;
  }
  return crossings;
}

// Simplifica una línea abierta (Ramer-Douglas-Peucker) sin sacar los puntos `keep`.
function simplify(pts, eps, keep = new Set()) {
  const out = new Set([0, pts.length - 1, ...keep]);
  const rec = (i, j) => {
    let best = -1, bd = eps;
    for (let k = i + 1; k < j; k++) { const d = segDist(pts[k], pts[i], pts[j]); if (d > bd) { bd = d; best = k; } }
    if (best >= 0) { out.add(best); rec(i, best); rec(best, j); }
  };
  const idx = [...out].sort((a, b) => a - b);
  for (let k = 0; k + 1 < idx.length; k++) rec(idx[k], idx[k + 1]);
  return [...out].sort((a, b) => a - b);
}
// Puntos de control para una línea: los de la simplificación, sin huecos de más de `gap` m.
function controlPoints(pts, keepIdx, eps, gap) {
  const idx = simplify(pts, eps, new Set(keepIdx));
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
  const out = [];
  for (let k = 0; k < idx.length; k++) {
    if (k > 0) {
      const s0 = cum[idx[k - 1]], s1 = cum[idx[k]], n = Math.floor((s1 - s0) / gap);
      for (let m = 1; m <= n; m++) {
        const s = s0 + ((s1 - s0) * m) / (n + 1);
        let j = idx[k - 1];
        while (j < idx[k] && cum[j + 1] < s) j++;
        out.push({ i: -1, s, p: pointOn(pts, cum, s) });
      }
    }
    out.push({ i: idx[k], s: cum[idx[k]], p: pts[idx[k]] });
  }
  return out;
}
function pointOn(pts, cum, s) {
  let j = 0;
  while (j < pts.length - 2 && cum[j + 1] < s) j++;
  const t = (s - cum[j]) / Math.max(cum[j + 1] - cum[j], 1e-6);
  return [pts[j][0] + (pts[j + 1][0] - pts[j][0]) * t, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * t];
}

// Manijas para que las rectas queden rectas: en cada punto, en la dirección
// del anterior al siguiente y no más largas que un tercio del tramo más corto
// de los dos (así una curva no "empuja" la recta larga de al lado).
function cornerHandles(pts, before, after) {
  return pts.map((p, i) => {
    const prev = i ? pts[i - 1] : before, next = i < pts.length - 1 ? pts[i + 1] : after;
    const d = sub(next, prev), l = len(d) || 1, u = [d[0] / l, d[1] / l];
    const k = Math.min(dist(p, prev), dist(p, next)) / 3;
    const r1 = (v) => Math.round(v * 10) / 10;
    return { in: [r1(-u[0] * k), r1(-u[1] * k)], out: [r1(u[0] * k), r1(u[1] * k)] };
  });
}
// Interpreta lo pintado. Devuelve lo que va a quedar (para mostrarlo) y, si
// se puede, la pista (puntos, caminos alternativos y meta).
function interpretPaint() {
  const strokes = paintStrokes(), hw = map.half_width;
  const first = strokes.find((s) => !s.erase);
  if (!first) return null;
  const r = rasterPaint(strokes, hw);
  if (!r) return null;
  const G = skeletonGraph(r, thin(r), hw);
  const crossings = tidyGraph(G, hw);
  const nodes = G.nodes, edges = G.edges.filter((e) => e.alive);
  const warnings = [];
  const view = { edges, nodes: nodes.filter((n) => n.alive), crossings, warnings, main: null, branches: [], meta: null, ok: false };
  const firstP = first.pts[0];
  let fd = [0, 0];
  for (const p of first.pts) { if (dist(p, firstP) > hw) { fd = sub(p, firstP); break; } }
  // La vuelta principal: la que pasa por donde se empezó a pintar.
  const near = (e) => distToLine(firstP, e.pts, e.closed);
  const candidates = edges.filter((e) => e.closed || (e.a !== null && e.b !== null));
  if (!candidates.length) { warnings.push("Todavía no hay una vuelta: la pista tiene que cerrarse (terminar donde empezó)."); return view; }
  candidates.sort((x, y) => near(x) - near(y));
  const metaEdge = candidates[0];
  let mainEdges = [];
  if (metaEdge.closed || metaEdge.a === metaEdge.b) mainEdges = [[metaEdge, true]];
  else {
    // El camino más corto que vuelve (sin usar el tramo de la meta).
    const distTo = new Map([[metaEdge.b, 0]]), prev = new Map(), todo = new Set(nodes.filter((n) => n.alive).map((n) => n.id));
    while (todo.size) {
      let u = null;
      for (const n of todo) if (distTo.has(n) && (u === null || distTo.get(n) < distTo.get(u))) u = n;
      if (u === null || u === metaEdge.a) break;
      todo.delete(u);
      for (const e of edges) {
        if (e === metaEdge || e.closed || e.a === null || e.b === null) continue;
        for (const [x, y, fwd] of [[e.a, e.b, true], [e.b, e.a, false]]) {
          if (x !== u) continue;
          const d = distTo.get(u) + polyLen(e.pts);
          if (!distTo.has(y) || d < distTo.get(y)) { distTo.set(y, d); prev.set(y, [e, fwd, u]); }
        }
      }
    }
    if (!prev.has(metaEdge.a)) { warnings.push("La pista no da la vuelta: unila para que termine donde empieza."); return view; }
    const path = [];
    for (let n = metaEdge.a; n !== metaEdge.b; ) { const [e, fwd, from] = prev.get(n); path.unshift([e, fwd]); n = from; }
    mainEdges = [[metaEdge, true], ...path];
  }
  // La línea de la vuelta (y en qué punto de ella está cada nudo).
  let main = [];
  const nodeAt = new Map();
  for (const [e, fwd] of mainEdges) {
    const p = fwd ? e.pts : e.pts.slice().reverse();
    const startNode = fwd ? e.a : e.b;
    if (startNode !== null && !nodeAt.has(startNode)) nodeAt.set(startNode, main.length);
    main.push(...(main.length ? p.slice(1) : p));
  }
  if (main.length > 2 && dist(main[0], main[main.length - 1]) < 1) main.pop();
  // Sentido: el del primer trazo.
  const nearestIdx = (pt) => { let bi = 0, bd = Infinity; main.forEach((q, i) => { const d = dist(q, pt); if (d < bd) { bd = d; bi = i; } }); return bi; };
  const fi = nearestIdx(firstP), M = main.length;
  const t = sub(main[(fi + 2) % M], main[(fi - 2 + M) % M]);
  if (t[0] * fd[0] + t[1] * fd[1] < 0) {
    main.reverse();
    for (const [n, i] of nodeAt) nodeAt.set(n, (M - 1 - i + M) % M);
  }
  const cumOf = (pts) => { const c = [0]; for (let i = 1; i <= pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i % pts.length])); return c; };
  let cum = cumOf(main);
  const L = cum[M];
  const fwdDir = (i) => { const d = sub(main[(i + 3) % M], main[(i - 3 + M) % M]); const l = len(d) || 1; return [d[0] / l, d[1] / l]; };
  // Caminos alternativos: tramos que salen de la vuelta y vuelven a ella.
  const mainSet = new Set(mainEdges.map(([e]) => e));
  const branches = [];
  for (const e of edges) {
    if (mainSet.has(e)) continue;
    if (e.closed) { warnings.push("Hay una vuelta pintada aparte que no se une con la pista: la dejé afuera."); continue; }
    if (e.a === null || e.b === null) { warnings.push("Hay un pedazo pintado que no vuelve a la pista: lo dejé afuera."); continue; }
    if (!nodeAt.has(e.a) || !nodeAt.has(e.b)) { warnings.push("Hay un camino que sale de otro camino alternativo: por ahora los caminos tienen que salir de la pista y volver a ella. Lo dejé afuera."); continue; }
    if (e.a === e.b) { warnings.push("Hay un camino que sale y vuelve al mismo lugar: lo dejé afuera."); continue; }
    // Sale para adelante de uno de los dos nudos: ese es de donde sale.
    const da = edgeDir(e, true, hw * 2.5), ma = fwdDir(nodeAt.get(e.a));
    const fromA = da[0] * ma[0] + da[1] * ma[1] >= 0;
    const pts = fromA ? e.pts.slice() : e.pts.slice().reverse();
    const from = fromA ? e.a : e.b, to = fromA ? e.b : e.a;
    const sFrom = cum[nodeAt.get(from)], sTo = cum[nodeAt.get(to)];
    branches.push({ pts, from, to, sFrom, span: (sTo - sFrom + L) % L });
  }
  view.main = main; view.branches = branches;
  // La meta: donde se empezó a pintar, si ahí no hay caminos alternativos; si
  // no, en el medio del tramo más largo con un solo camino.
  const covered = (s, margin) => branches.some((b) => ((s - b.sFrom + L) % L) < b.span + margin || ((b.sFrom - s + L) % L) < margin);
  let s0 = cum[nearestIdx(firstP)];
  if (covered(s0, 30)) {
    let best = -1, bestLen = 0;
    for (let k = 0; k < 400; k++) {
      const s = (L * k) / 400;
      if (covered(s, 0)) continue;
      let a = 0; while (a < L && !covered((s - a + L) % L, 0)) a += 2;
      let b = 0; while (b < L && !covered((s + b) % L, 0)) b += 2;
      if (Math.min(a, b) > bestLen) { bestLen = Math.min(a, b); best = s; }
    }
    if (best < 0) { warnings.push("Los caminos alternativos ocupan toda la vuelta: tiene que quedar algún tramo con un solo camino para la meta."); return view; }
    s0 = best;

  for (const [n, i] of nodeAt) nodeAt.set(n, (i - k0 + M) % M);

  for (const b of branches) b.sFrom = cum[nodeAt.get(b.from)];

  view.meta = main[0];

  const freeAfter = Math.min(L, ...branches.map((b) => b.sFrom));
  const freeBefore = L - Math.max(0, ...branches.map((b) => b.sFrom + b.span));
  const straight = (dir, maxLen) => {
    let l = 10;
    const d0 = dir > 0 ? sub(main[3 % M], main[0]) : sub(main[(M - 3) % M], main[0]);
    const u = mul(d0, 1 / (len(d0) || 1));
    for (let s = 10; s <= maxLen; s += 2) {
      const p = pointOn(main.concat([main[0]]), cum, dir > 0 ? s : L - s);
      const off = sub(p, main[0]), along = off[0] * u[0] + off[1] * u[1];
      if (Math.abs(off[0] * u[1] - off[1] * u[0]) > hw * 0.3 || along < s * 0.9) break;

    }
    return l;
  };
  const front = Math.max(10, Math.min(60, freeAfter - 15, straight(1, 60)));
  const back = Math.max(10, Math.min(40, freeBefore - 15, straight(-1, 40)));
  const dirF = sub(main[3 % M], main[(M - 3) % M]);
  const start = { x: round(main[0][0]), z: round(main[0][1]), angle: round((Math.atan2(-dirF[1], dirF[0]) * 180) / Math.PI), back: Math.round(back), front: Math.round(front), bend: 0 };
  // Puntos de la pista: entre las puntas de la recta, sin perder los nudos.
  const closedMain = main.concat([main[0]]);
  const lo = front + 12, hi = L - back - 12;
  const keepS = [...nodeAt.values()].map((i) => cum[i]);
  const sub0 = [], keepIdx = [];
  for (let i = 0; i < closedMain.length; i++) if (cum[i] >= lo && cum[i] <= hi) sub0.push(i);
  if (sub0.length < 2) { warnings.push("La vuelta es muy corta."); return view; }
  const span = sub0.map((i) => closedMain[i]);
  sub0.forEach((i, k) => { if (keepS.includes(cum[i])) keepIdx.push(k); });
  // Pocos puntos (más fácil de editar después): solo donde la pista dobla;
  // en una recta, ninguno en el medio.
  const eps = Math.max(4, hw * 0.35);
  const cps = controlPoints(span, keepIdx, eps, Infinity);
  const path = cps.map((c) => c.p);
  const rad = (start.angle * Math.PI) / 180, sdir = [Math.cos(rad), -Math.sin(rad)];
  const pathHandles = cornerHandles(path, add(main[0], mul(sdir, start.front)), sub(main[0], mul(sdir, start.back)));

  const outBranches = [];
  for (const b of branches) {
    const from = idxOfNode(b.from), to = idxOfNode(b.to);
    if (from < 0 || to < 0 || from >= to) { warnings.push("Un camino alternativo queda muy pegado a la meta: alejalo un poco."); continue; }
    const bl = polyLen(b.pts);
    const bc = controlPoints(b.pts, [], eps, Infinity).filter((c) => c.s > hw && c.s < bl - hw).map((c) => c.p);
    if (!bc.length) bc.push(pointOn(b.pts, cumOf(b.pts).slice(0, b.pts.length), bl / 2));
    outBranches.push({ from, to, path: bc, handles: cornerHandles(bc, b.pts[0], b.pts[b.pts.length - 1]) });
  }
  view.ok = true;
  view.result = { path, handles: pathHandles, branches: outBranches, start };
  return view;
}

function schedulePaintView() {
  clearTimeout(paintTimer);
  paintTimer = setTimeout(() => { try { paintView = interpretPaint(); } catch (err) { paintView = null; console.error(err); } draw(); if (tool === "paint") refreshPanel(); }, 120);
}

// Pasa lo interpretado al mapa (se puede deshacer con Ctrl+Z).
function applyPaint() {
  const v = interpretPaint();
  if (!v?.ok) { toast(v?.warnings?.[0] || "Pintá la pista primero."); return; }
  const r3 = (p) => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10];
  map.path = v.result.path.map((p, i) => ({ p: r3(p), ...v.result.handles[i] }));
  map.branches = v.result.branches.map((b) => ({ from: b.from, to: b.to, path: b.path.map((p, i) => ({ p: r3(p), ...b.handles[i] })) }));
  map.start = v.result.start;
  map.smoothing = 10;
  map.open = false;
  map.paint = [];
  paintView = null;
  sel = { kind: "path", node: -1 };
  commit(); setTool("select"); fit();
  const groups = new Set(map.branches.map((b) => b.from + ":" + b.to)).size;
  toast(`Listo: ${Math.round(computed().length)} m por vuelta` + (map.branches.length ? `, ${map.branches.length} ${map.branches.length === 1 ? "camino alternativo" : "caminos alternativos"} en ${groups} ${groups === 1 ? "tramo" : "tramos"}` : "") + (v.crossings ? `, ${v.crossings} ${v.crossings === 1 ? "cruce" : "cruces"}` : "") + ". Ctrl+Z vuelve a lo pintado.");
}

// La pista de ahora, como pintura (para corregirla pintando).
function trackToPaint() {
  const { line, branches } = computed();
  if (line.length < 3) { toast("No hay pista para pasar a pintura."); return; }
  const thinOut = (pts) => pts.filter((p, i) => i % 2 === 0 || i === pts.length - 1).map((p) => [round(p[0]), round(p[1])]);
  const strokes = [{ erase: false, pts: thinOut(line.open ? line : line.concat([line[0], line[1]])) }];
  for (const b of branches) if (b.length > 1) strokes.push({ erase: false, pts: thinOut(b) });
  map.paint = strokes;
  commit(); schedulePaintView(); refreshPanel();
  toast("La pista está pintada: agregá o borrá con el pincel y la goma, y después confirmá.");
}

// Lo pintado, en una capa aparte (la goma borra de verdad lo de abajo).
let paintLayer = null;
function drawPaint(C) {
  const strokes = paintStrokes();
  if (!strokes.length) return;
  if (!paintLayer) paintLayer = document.createElement("canvas");
  if (paintLayer.width !== cv.width || paintLayer.height !== cv.height) { paintLayer.width = cv.width; paintLayer.height = cv.height; }
  const pc = paintLayer.getContext("2d");
  pc.setTransform(1, 0, 0, 1, 0, 0); pc.clearRect(0, 0, paintLayer.width, paintLayer.height);
  pc.setTransform(DPR, 0, 0, DPR, 0, 0);
  pc.lineCap = "round"; pc.lineJoin = "round";
  for (const st of strokes) {
    pc.globalCompositeOperation = st.erase ? "destination-out" : "source-over";
    const w = 2 * (st.erase ? map.half_width * 1.2 : map.half_width) * cam.zoom;
    pc.strokeStyle = pc.fillStyle = C.lane;
    if (st.pts.length === 1) { const s = toScreen(st.pts[0]); pc.beginPath(); pc.arc(s[0], s[1], w / 2, 0, Math.PI * 2); pc.fill(); continue; }
    pc.lineWidth = w; pc.beginPath();
    st.pts.forEach((p, i) => { const s = toScreen(p); i ? pc.lineTo(s[0], s[1]) : pc.moveTo(s[0], s[1]); });
    pc.stroke();
  }
  pc.globalCompositeOperation = "source-over";
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = tool === "paint" ? 0.9 : 0.55; ctx.drawImage(paintLayer, 0, 0); ctx.restore();
  // Lo que el editor entiende: la vuelta (blanco), los caminos alternativos
  // (naranja), los cruces y la meta.
  const v = paintView;
  if (!v || tool !== "paint") return;
  const line = (pts, color, closed) => {
    if (!pts || pts.length < 2) return;
    pathLine(pts, closed); ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
  };
  if (v.main) { line(v.main, "#ffffff", true); drawArrows(v.main, true); }
  v.branches.forEach((b) => { line(b.pts, C.sel, false); drawArrows(b.pts, false); });
  for (const b of v.branches) for (const p of [b.pts[0], b.pts[b.pts.length - 1]]) {
    const s = toScreen(p); ctx.beginPath(); ctx.arc(s[0], s[1], 6, 0, Math.PI * 2); ctx.fillStyle = C.sel; ctx.fill(); ctx.strokeStyle = "#0b2230"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (v.meta) {
    const s = toScreen(v.meta);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(s[0] - 7, s[1] - 7, 14, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#111"; ctx.fillRect(s[0] - 7, s[1] - 7, 7, 7); ctx.fillRect(s[0], s[1], 7, 7);
  }
}

function paintPanel(box, title) {
  title.textContent = "Pintar pista";
  const row = document.createElement("div"); row.className = "row";
  const b1 = btn("Pincel", () => { paintErase = false; refreshPanel(); setHint(); }, !paintErase);
  const b2 = btn("Goma", () => { paintErase = true; refreshPanel(); setHint(); }, paintErase);
  row.append(b1, b2);
  box.append(row);
  box.append(field("Ancho de la pista (m)", "num", map.half_width * 2, (v) => { map.half_width = Math.max(12, v / 2); schedulePaintView(); }, { id: "paint_width" }));
  const v = paintView;
  if (!paintStrokes().length) box.append(note("Pintá la pista con el mouse (o el dedo), como un camino de agua. Donde empezás a pintar va la meta, y el sentido de la carrera es para donde pintaste. Si pintás dos caminos que se separan y se vuelven a juntar, son caminos alternativos; si se cruzan, es un cruce."));
  else if (v) {
    const parts = [];
    if (v.main) parts.push(`una vuelta de ${Math.round(polyLen(v.main.concat([v.main[0]])))} m`);
    if (v.branches.length) parts.push(`${v.branches.length} ${v.branches.length === 1 ? "camino alternativo" : "caminos alternativos"}`);
    if (v.crossings) parts.push(`${v.crossings} ${v.crossings === 1 ? "cruce" : "cruces"}`);
    box.append(note(parts.length ? "Veo " + parts.join(", ") + ". En blanco la vuelta, en naranja los caminos alternativos, y el cuadrito es la meta." : "Seguí pintando."));
    for (const w of v.warnings) box.append(note("Ojo: " + w));
  }
  const row2 = document.createElement("div"); row2.className = "row";
  row2.append(btn("Listo: pasarlo a pista", applyPaint, true));
  box.append(row2);
  const row3 = document.createElement("div"); row3.className = "row";
  if (map.path.length && !paintStrokes().length) row3.append(btn("Pintar sobre la pista de ahora", trackToPaint));
  if (paintStrokes().length) row3.append(btn("Borrar lo pintado", () => { map.paint = []; paintView = null; commit(); refreshPanel(); }));
  box.append(row3);
  box.append(note("Ctrl+Z deshace el último trazo. Clic derecho y arrastrar mueve la vista; la rueda acerca y aleja. Con Shift apretado el pincel borra."));
}

// ---------------------------------------------------------------------------
// Tocar y arrastrar
// ---------------------------------------------------------------------------
let drag = null;
const pointers = new Map();
let spaceDown = false;

function hitNodes(nodes, s) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (nodes.length >= 2) {
      for (const which of ["in", "out"]) {
        const h = which === "in" ? handleIn(nodes, i) : handleOut(nodes, i);
        if (len(h) < 0.01) continue;
        if (dist(toScreen(add(n.p, h)), s) < 8) return { node: i, handle: which };
      }
    }
    if (dist(toScreen(n.p), s) < 9) return { node: i, handle: null };
  }
  return null;
}
function hitSegment(nodes, s) {
  for (let i = 0; i < nodes.length; i++) {
    const c = segControls(nodes, i);
    let prev = toScreen(c[0]);
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, cur = toScreen(bez(c, t));
      if (segDist(s, prev, cur) < 8) return { seg: i, t: (k - 0.5) / 24 };
      prev = cur;
    }
  }
  return null;
}
function hitTest(s) {
  const w = toWorld(s);
  if (sel?.kind === "branch" && map.branches[sel.i]) {
    const h = hitNodes(map.branches[sel.i].path, s);
    if (h) return { kind: "branch", i: sel.i, ...h };
  }
  // Primero lo que está seleccionado (sus puntos y manijas).
  if (sel?.kind === "piece" && DRAWN[map.pieces[sel.i]?.type]) {
    const p = map.pieces[sel.i];
    for (let k = (p.skylights || []).length - 1; k >= 0; k--) if (dist(toScreen(p.skylights[k]), s) < 9) return { kind: "piece", i: sel.i, sky: k };
    const h = hitNodes(nodesOf(p), s);
    if (h) return { kind: "piece", i: sel.i, ...h };
  }
  if (map.start && (sel?.kind === "start" || tool === "start")) {
    const h = startHandles();
    for (const part of ["front", "back", "center"]) if (dist(toScreen(h[part]), s) < 10) return { kind: "start", part };
  }
  if (map.start && (tool === "select" || tool === "start") && distToLine(w, startHandles().pts, false) < map.half_width * 0.5) return { kind: "start", part: "center" };
  if (map.path.length && (tool === "track" || sel?.kind === "path")) {
    const h = hitNodes(map.path, s);
    if (h) return { kind: "path", ...h };
  }
  // Manijas de giro de las piezas seleccionadas.
  if (sel?.kind === "piece") {
    const p = map.pieces[sel.i];
    if (p.type === "rock_arch" || p.type === "waterfall") {
      const a = ((p.angle ?? 0) * Math.PI) / 180, span = p.type === "waterfall" ? (p.width ?? 50) / 2 : p.span ?? 40;
      if (dist(toScreen([p.x + Math.cos(a) * span, p.z - Math.sin(a) * span]), s) < 9) return { kind: "piece", i: sel.i, rotate: true };
    }
  }
  // Puntas de las guirnaldas y sus cables.
  for (let i = map.pieces.length - 1; i >= 0; i--) {
    const p = map.pieces[i];
    if (!p.a || !p.b) continue;
    if (dist(toScreen(p.a), s) < 9) return { kind: "piece", i, end: "a" };
    if (dist(toScreen(p.b), s) < 9) return { kind: "piece", i, end: "b" };
    if (distToLine(w, [p.a, p.b], false) < Math.max(3, 8 / cam.zoom)) return { kind: "piece", i };
  }
  // Piezas chicas arriba de todo, después islas, rocas y la pista.
  for (let i = map.pieces.length - 1; i >= 0; i--) {
    const p = map.pieces[i];
    if (!("x" in p)) continue;
    const r = p.type === "rock_arch" || p.type === "waterfall" || p.type === "shipwreck" ? 12 : GEYSER_RADIUS + 2;
    if (dist(w, [p.x, p.z]) < Math.max(r, 9 / cam.zoom)) return { kind: "piece", i };
  }
  const { shapes, line } = computed();
  for (let i = map.pieces.length - 1; i >= 0; i--) {
    const p = map.pieces[i];
    if (DRAWN[p.type] && !isClosed(p) && shapes[i]?.length >= 2 && distToLine(w, shapes[i], false) < Math.max((p.width ?? 14) / 2 + 2, 8 / cam.zoom)) return { kind: "piece", i };
  }
  for (let i = map.pieces.length - 1; i >= 0; i--) if (shapes[i] && isClosed(map.pieces[i]) && pointInPoly(w, shapes[i])) return { kind: "piece", i };
  const { branches } = computed();
  for (let i = branches.length - 1; i >= 0; i--) if (branches[i].length > 1 && distToLine(w, branches[i], false) < map.half_width) {
    // En la parte que comparte con la pista (donde se abre) gana la pista.
    if (line.length > 2 && distToLine(w, line, !line.open) < distToLine(w, branches[i], false)) continue;
    return { kind: "branch", i };
  }
  if (line.length > 2 && distToLine(w, line, !line.open) < map.half_width) return { kind: "path" };

}

function onDown(e) {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (pointers.size === 2) { drag = { kind: "pinch", start: pinchState() }; return; }
  const s = [e.offsetX, e.offsetY], w = toWorld(s);
  // Clic derecho (o la rueda apretada) mueve la vista, con cualquier herramienta.
  if (tool === "pan" || spaceDown || e.button === 1 || e.button === 2) { drag = { kind: "pan", s, cam: { ...cam } }; return; }
  if (tool === "paint") {
    paintStroke = { erase: paintErase || e.shiftKey, pts: [[round(w[0]), round(w[1])]] };
    paintStrokes().push(paintStroke);
    drag = { kind: "paint" };
    draw(); return;
  }

  if (tool === "start") {
    const hit = hitTest(s);
    if (hit?.kind === "start") { sel = { kind: "start" }; refreshPanel(); drag = { kind: "start", part: hit.part, start: w, orig: { ...map.start }, moved: false }; draw(); return; }
    placeStart(w); return;
  }
  if (tool === "branch") return branchDown(s, w, e);
  if (tool === "track" || DRAWN[tool]) return penDown(s, w, e);
  if (PIECES[tool]?.place === "two_points") {
    // La guirnalda va de una isla tropical a otra; otras piezas de dos puntas, donde sea.
    const isles = tool === "light_string";
    const isle = isles ? tropicalAt(w) : -1;
    if (isles && isle < 0) { toast("Tocá adentro de una isla tropical."); return; }
    if (!pendingLights) { pendingLights = { a: w, i: isle }; toast(isles ? "Ahora tocá la otra isla." : "Ahora tocá la otra punta."); draw(); return; }
    if (isles && isle === pendingLights.i) { toast("La otra punta tiene que ir en otra isla."); return; }
    const piece = { type: tool, a: pendingLights.a, b: w };
    for (const [k, , , d] of PIECES[tool].params) piece[k] = d;
    map.pieces.push(piece);
    pendingLights = null;
    sel = { kind: "piece", i: map.pieces.length - 1 };
    commit(); setTool("select"); return;
  }
  if (tool === "island" || PIECES[tool]?.place === "point") {
    // La isla redonda es una isla tropical (arena, palmeras y público) con forma de círculo.
    if (tool === "island") { map.pieces.push(roundIsland(w, 20)); sel = { kind: "piece", i: map.pieces.length - 1 }; }
    else {
      const p = { type: tool, x: w[0], z: w[1] };
      map.pieces.push(p); sel = { kind: "piece", i: map.pieces.length - 1 };
    }
    commit(); refreshPanel(); setTool("select");
    drag = { kind: "move", start: w, moved: false, orig: JSON.parse(JSON.stringify(map.pieces[sel.i])) };
    return;
  }
  // Seleccionar
  const hit = hitTest(s);
  if (!hit) { sel = { kind: "map" }; refreshPanel(); draw(); drag = { kind: "pan", s, cam: { ...cam } }; return; }
  if (hit.kind === "path" && hit.node === undefined) { sel = { kind: "path", node: -1 }; refreshPanel(); draw(); drag = { kind: "pan", s, cam: { ...cam } }; return; }
  if (hit.kind === "start") { sel = { kind: "start" }; refreshPanel(); draw(); drag = { kind: "start", part: hit.part, start: w, orig: { ...map.start }, moved: false }; return; }
  if (hit.kind === "branch" && (hit.node === undefined || hit.node === null)) { sel = { kind: "branch", i: hit.i, node: -1 }; refreshPanel(); draw(); drag = { kind: "pan", s, cam: { ...cam } }; return; }
  sel = { kind: hit.kind, i: hit.i, node: hit.node ?? -1, sky: hit.sky };
  refreshPanel(); draw();
  if (hit.node !== undefined && hit.node !== null) {
    const nodes = hit.kind === "path" ? map.path : hit.kind === "branch" ? map.branches[hit.i].path : nodesOf(map.pieces[hit.i]);
    drag = { kind: "node", nodes, node: hit.node, handle: hit.handle, start: w, orig: JSON.parse(JSON.stringify(nodes[hit.node])), alt: e.altKey, moved: false };
  } else if (hit.sky !== undefined) {
    drag = { kind: "sky", p: map.pieces[hit.i], k: hit.sky, moved: false };
  } else if (hit.end) drag = { kind: "lsend", p: map.pieces[hit.i], end: hit.end, moved: false };
  else if (hit.rotate) drag = { kind: "rotate", target: map.pieces[hit.i], moved: false };
  else {
    const target = map.pieces[hit.i];
    drag = { kind: "move", start: w, moved: false, orig: JSON.parse(JSON.stringify(target)) };
  }
}
function penDown(s, w, e) {

    const h = hitNodes(map.path, s);
    if (h) { sel = { kind: "path", node: h.node }; refreshPanel(); drag = { kind: "node", nodes: map.path, node: h.node, handle: h.handle, start: w, orig: JSON.parse(JSON.stringify(map.path[h.node])), alt: e.altKey, moved: false }; draw(); return; }

    if (seg) { const before = map.path.slice(); insertNode(map.path, seg.seg, seg.t); fixBranches(before); sel = { kind: "path", node: seg.seg + 1 }; commit(); refreshPanel(); return; }
    toast("La pista ya está dibujada: tocá un tramo para agregar un punto, o un punto para moverlo.");
    return;
  }
  if (!drawing) {
    if (isTrack) { map.path = []; map.branches = []; map.ring = false; map.open = true; drawing = { kind: "path" }; sel = { kind: "path", node: -1 }; }

  }
  const taken = Object.values(BUILTIN).filter((b) => b.id !== map.id).map((b) => b.order);
  if (taken.includes(map.order)) out.push(["bad", `El número de mapa ${map.order} ya lo usa otro mapa del juego. Usá ${Math.max(...taken) + 1}.`]);
  if (!out.length) out.push(["ok", "Todo en orden para el juego."]);
  return { out, length };
}
function refreshReview() {
  const { out, length } = review();
  const geysers = map.pieces.filter((p) => p.type === "geyser").length;
  const caves = map.pieces.filter((p, i) => p.type === "rock_formation" && computed().line.length > 2 && computed().shapes[i]?.length >= 3 && rockTouchesTrack(computed().shapes[i], computed().line)).length;
  $("stats").innerHTML = "";
  for (const [v, l] of [[Math.round(length), "m por vuelta"], [map.pieces.filter((p) => p.type === "tropical_island").length, "islas"], [caves, caves === 1 ? "cueva" : "cuevas"], [map.laps, "vueltas"], [map.path.length, "puntos"], [geysers, "géiseres"]]) {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = v; const sp = document.createElement("span"); sp.textContent = l;
    d.append(b, sp); $("stats").append(d);
  }
  const ul = $("warns"); ul.innerHTML = "";
  for (const [lvl, text] of out) {
    const li = document.createElement("li");
    const pill = document.createElement("span"); pill.className = "pill " + lvl; pill.textContent = lvl === "bad" ? "Error" : lvl === "warn" ? "Ojo" : "Bien";
    const t = document.createElement("span"); t.textContent = text;
    li.append(pill, t); ul.append(li);
  }
}

// ---------------------------------------------------------------------------
// Abrir, importar, exportar y guardar para el juego
// ---------------------------------------------------------------------------
const saved = new Map();
function fillPicker() {
  const pk = $("mapPicker"); pk.innerHTML = "";
  const g1 = document.createElement("optgroup"); g1.label = "Mapas del juego";
  BUILTIN.forEach((b, i) => { const o = document.createElement("option"); o.value = "builtin:" + i; o.textContent = cap(b.name); g1.append(o); });
  pk.append(g1);
  if (saved.size) {
    const g2 = document.createElement("optgroup"); g2.label = "Guardados";
    for (const [id, d] of saved) { const o = document.createElement("option"); o.value = "saved:" + id; o.textContent = cap(d.name || id); g2.append(o); }
    pk.append(g2);
  }
  const o = document.createElement("option"); o.value = "new"; o.textContent = "+ Mapa nuevo"; pk.append(o);
  if (currentKey === "draft") { const od = document.createElement("option"); od.value = "draft"; od.textContent = `Borrador: ${cap(map.name)}`; pk.prepend(od); }
  pk.value = currentKey;
}
const cap = (t) => (t ? t[0].toUpperCase() + t.slice(1) : t);
function openMap(key) {
  if (key === "new") {
    const next = Math.max(...BUILTIN.map((b) => b.order), ...[...saved.values()].map((d) => d.order ?? 0)) + 1;
    map = fromJSON({ id: "mapa_nuevo", name: "mapa nuevo", order: next, laps: 3, half_width: 20, smoothing: 20, ring_count: 12, rock_count: 10, path: [], pieces: [] });
    currentKey = "draft"; setTool("paint");
  } else if (key.startsWith("builtin:")) { map = fromJSON(BUILTIN[+key.slice(8)]); currentKey = key; }
  else if (key.startsWith("saved:")) { map = fromJSON(saved.get(key.slice(6))); currentKey = key; }
  sel = { kind: "map" }; drawing = null;
  resetHistory(); fillPicker(); invalidate(); refreshPanel(); fit(); saveDraft();
}
$("mapPicker").addEventListener("change", (e) => openMap(e.target.value));

function showJSON() {
  $("jsonTitle").textContent = "JSON del mapa";
  $("jsonNote").textContent = `Este es el archivo del mapa, tal como lo lee el juego (world/maps/${toJSON(map).id}.json).`;
  $("jsonText").value = prettyJSON(toJSON(map)); $("jsonText").readOnly = true;
  $("jsonLoad").hidden = true; $("jsonCopy").hidden = false; $("jsonDownload").hidden = false;
  $("jsonDlg").showModal();
}
function showImport() {
  $("jsonTitle").textContent = "Importar un mapa";
  $("jsonNote").textContent = "Pegá acá el JSON de un mapa (por ejemplo un archivo de world/maps/).";
  $("jsonText").value = ""; $("jsonText").readOnly = false;
  $("jsonLoad").hidden = false; $("jsonCopy").hidden = true; $("jsonDownload").hidden = true;
  $("jsonDlg").showModal(); $("jsonText").focus();
}
$("exportBtn").onclick = showJSON;
$("importBtn").onclick = showImport;
$("jsonLoad").onclick = () => {
  try {
    const d = JSON.parse($("jsonText").value);
    if (!d || typeof d !== "object" || (!d.path && !d.pieces && !d.islands)) throw new Error("no parece un mapa");
    map = fromJSON(d); currentKey = "draft"; sel = { kind: "map" };
    resetHistory(); fillPicker(); invalidate(); refreshPanel(); fit(); saveDraft();
    $("jsonDlg").close(); toast("Mapa importado.");
  } catch (err) { toast("No se pudo leer: " + err.message); }
};
$("jsonCopy").onclick = async () => {
  const ta = $("jsonText");
  try { await navigator.clipboard.writeText(ta.value); toast("JSON copiado."); }
  catch { ta.focus(); ta.select(); toast("Seleccionado: copialo con Ctrl+C."); }
};
$("downloadBtn").onclick = async () => {
  if (drawing) finishDrawing();
  const errs = review().out.filter((r) => r[0] === "bad");
  if (errs.length) { toast("Primero arreglá los errores de la revisión (si no, GitHub no lo publica)."); return; }
  await downloadMap();
};
$("jsonDownload").onclick = () => downloadMap();
async function downloadMap() {
  const d = toJSON(map);
  try {
    const dl = await window.claude?.use?.("downloads");
    if (!dl) throw { code: "unavailable" };
    await dl.save({ filename: `${d.id}.json`, data: prettyJSON(d) + "\n" });
    toast(`Listo: ${d.id}.json. Subilo a world/maps/ en GitHub (ver COMO_SUBIR_UN_MAPA.md).`);
  } catch (err) {
    if (err?.code === "declined") return;
    showJSON();
    toast("Acá no se puede descargar: copiá el JSON y guardalo como " + d.id + ".json.");
  }
}

async function saveForGame() {
  const errs = review().out.filter((r) => r[0] === "bad");
  if (errs.length) { toast("Primero arreglá los errores de la revisión."); return; }
  if (drawing) finishDrawing();
  const d = toJSON(map);
  if (!db) { showJSON(); toast("No se pudo guardar acá: copiá el JSON y pasáselo a Claude."); return; }
  try {
    await db.collection("maps").doc(d.id).set({ id: d.id, name: d.name, order: d.order, json: prettyJSON(d), updated: new Date().toISOString() });
    currentKey = "saved:" + d.id;
    toast(`Guardado "${cap(d.name)}". Avisale a Claude que lo agregue al juego.`);
  } catch (err) {
    showJSON(); toast("No se pudo guardar (" + (err?.code || "error") + "): copiá el JSON.");
  }
}
$("saveBtn").onclick = saveForGame;

function renderSaved() {
  const box = $("savedList"); box.innerHTML = "";
  if (!db) { box.append(note("Guardar para el juego no está disponible en esta vista. Usá Ver JSON y copiáselo a Claude.")); return; }
  if (!saved.size) { box.append(note("Todavía no guardaste ninguno. Cuando un mapa esté listo, tocá Guardar para el juego y avisale a Claude.")); return; }
  for (const [id, d] of saved) {
    const b = document.createElement("button"); b.type = "button";
    const n = document.createElement("span"); n.textContent = cap(d.name || id);
    const t = document.createElement("small"); t.textContent = (d.updated || "").slice(0, 10) + ` · #${d.order}`;
    b.append(n, t); b.onclick = () => openMap("saved:" + id);
    box.append(b);
  }
}
async function connectDb() {
  const timer = setTimeout(() => { if (!db) renderSaved(); }, 10000);
  try {
    db = await window.claude?.use?.("db");
  } catch { db = null; }
  clearTimeout(timer);
  if (!db) { renderSaved(); return; }
  db.collection("maps").onSnapshot((snap) => {
    saved.clear();
    snap.docs.forEach((doc) => { try { const d = doc.data(); const m = JSON.parse(d.json); saved.set(doc.id, { ...m, updated: d.updated }); } catch {} });
    renderSaved(); fillPicker();
  }, () => renderSaved());
}

// Borrador local (por si se cierra la página).
function saveDraft() { try { localStorage.setItem("simplesurf-editor-draft", JSON.stringify({ key: currentKey, map: toJSON(map), open: !!map.open, paint: map.paint || [] })); } catch {} }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem("simplesurf-editor-draft") || "null");
    if (d?.map) { map = fromJSON(d.map); map.open = !!d.open && map.path.length > 0; map.paint = Array.isArray(d.paint) ? d.paint : []; currentKey = d.key?.startsWith("builtin:") ? d.key : "draft"; return true; }
  } catch {}
  return false;
}

let toastTimer = 0;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200); }

// ---------------------------------------------------------------------------
// Arranque: abre el archipiélago (o el borrador que quedó).
// ---------------------------------------------------------------------------
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
loadDraft();
resetHistory();
fillPicker();
sel = { kind: "map" };
setTool("select");
requestAnimationFrame(() => { resize(); fit(); });
document.fonts?.ready.then(draw);
connectDb();
</script>
